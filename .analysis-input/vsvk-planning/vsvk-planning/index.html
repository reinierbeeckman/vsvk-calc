  else if(a==='sbintrek'){ if(ui.sbTerug!==d.id){ui.sbTerug=d.id; render(); return} sbIntrek(d.id) }
  else if(a==='pfmail'){pfMail(d.id)}
  else if(a==='pfak'){pfAkkoordOpen(d.id)}
  else if(a==='pfpdf'){pfPdf(d.id)}
  else if(a==='pfintrek'){ if(ui.pfTerug!==d.id){ui.pfTerug=d.id; render(); return} pfIntrek(d.id) }
  else if(a==='dsverwerk'){dsVerwerk(String(d.k||'').split('|').filter(Boolean))}
  else if(a==='dsheropen'){dsHeropen(d.k)}
  else if(a==='facritme'){const kl=get('klanten',d.id); if(kl){const nw=kl.factuurRitme==='dag'?'week':'dag'; save('klanten',{...kl,factuurRitme:nw}); toast(`${kl.bedrijf}: factureren per ${nw}`)}}
  else if(a==='faccsv'){ if(d.f){const f=get('facturen',d.f); if(f){const ds=(f.dagstaatIds||[]).map(x=>get('dagstaten',x)).filter(Boolean); facDownload(facCsv(ds,f),`${f.factuurnr||f.voorstelNr}-${(f.klant||'klant').replace(/[^A-Za-z0-9]+/g,'-')}.csv`)}}
    else {const v=facZoek(d.k); if(v){const naam=`factuurvoorstel-${(klantNaam(v.klantId)).replace(/[^A-Za-z0-9]+/g,'-')}-${v.van===v.tot?v.van:'wk'+weeknr(v.van)}.csv`; facDownload(facCsv(v.ds,{voorstelNr:'concept'}),naam).then(ok=>{ if(!ok)return; const nu=new Date().toISOString(); v.ds.forEach(s=>{const x=get('dagstaten',s.id); if(x)save('dagstaten',{...x,geexporteerdOp:nu})}) })}} }
  else if(a==='facmaak'){const inp=document.getElementById('facnr_'+d.k); facMaak(d.k,inp?inp.value:'')}
  else if(a==='facterug'){ if(ui.facTerug!==d.f){ui.facTerug=d.f; render(); return} facTerug(d.f) }
  else if(a==='dagnav'){ui.dag=ui.dag||{}; const st=dagStand(d.k), d0=st==='alle'?vandaag():st; dagZet(d.k,d.n==='v'?vandaag():d.n==='m'?addDays(vandaag(),1):addDays(d0,+d.n)); render()}
  else if(a==='dagalle'){ui.dag=ui.dag||{}; dagZet(d.k,dagStand(d.k)==='alle'?vandaag():'alle'); render()}
  else if(a==='wkspring'){ui.wk=ui.wk||{}; ui.wk[d.k]=d.m; render()}
  else if(a==='wkalle'){ui.wk=ui.wk||{}; ui.wk[d.k]=wkStand(d.k)==='alle'?maandag(vandaag()):'alle'; render()}
  else if(a==='todo'){ ui.wbView=d.v; ui.dag={wb:(ui.dag||{}).wb}; if(d.k==='uk'){ui.dag.uk='alle'} if(d.k==='ret'){dagZet('ret','alle')} if(d.k==='pf'||d.k==='sb'||d.k==='wl'||d.k==='ik'){ui.wk=ui.wk||{}; ui.wk[d.k]='alle'} if(d.k==='wl')ui.wlWO=null; if(d.k==='ik')ui.ikWO=null; render(); window.scrollTo(0,0) }
  else if(a==='wbview'){ui.wbView=d.v; if(d.v==='werk')ui.wlWO=null; ui.dag={wb:(ui.dag||{}).wb}; render(); if(d.v==='inleveren')setTimeout(()=>{const x=document.getElementById('scanin'); if(x)x.focus()},0)}
  else if(a==='printdag'){printDag(pDag())}
  else if(a==='printsel'){printDag(pDag(),new Set(ui.printSel||[]))}
  else if(a==='pselset'){ const dd=pDag(); const ks=wbBatch(addDays(dd,-1),dd).filter(k=>bonMensen(k).length); const S2=new Set();
    ks.forEach(k=>bonMensen(k).forEach(m=>{const w=list('werkbonnen').find(x=>x.klusId===k.id&&x.medewerkerId===m&&x.status!=='Vervallen');
      const ok=d.v==='alle'||(d.v==='ongeprint'&&(!w||w.status==='Aangemaakt'))||(d.v==='verouderd'&&bonOpnieuw(w)); if(ok&&d.v!=='geen')S2.add(k.id+'|'+m)}));
    ui.printSel=S2; ui.printSelDag=dd; render() }
  else if(a==='wbvanwo'){ui.tab='werkbonnen';ui.wbFilter={status:'',mw:'',q:d.nr};render()}
  else if(a==='uitleg'){ui.uitleg=!ui.uitleg;render()}
  else if(a==='teamview'){ui.teamView=d.v;render()}
  else if(a==='loonmnd'){ui.loonMnd=mndPlus(ui.loonMnd||vandaag().slice(0,7),+d.n);render()}
  else if(a==='loonexp'){loonExport()}
  else if(a==='naaruren'){ui.tab='werkbonnen';ui.wbView='uren';ui.dag={...(ui.dag||{}),uk:d.m};render()}
  else if(a==='teamweek'){ui.teamStart=addDays(ui.teamStart,+d.n);render()}
  else if(a==='teamnu'){ui.teamStart=maandag(vandaag());render()}
  else if(a==='afwnieuw'){openAfw({},null)}
  else if(a==='ziekmelden'){openAfw({type:'Ziek'},null)}
  else if(a==='matniet'){openAfw({soort:'mat'},null)}
  else if(a==='oplossen'){openVerv(d.id)}
  else if(a==='toonwb'){ui.tab='werkbonnen';ui.wbView='alle';ui.wbFilter={status:'',mw:'',q:''};ui.dag={}; dagZet('wb',ui.datum); render()}
  else if(a==='vestsave'){const oud=VEST().slice(), nieuw=[...new Set(document.getElementById('set_vest').value.split('\n').map(x=>x.trim()).filter(Boolean))]; if(!nieuw.length){toast('Minimaal één vestiging');return}
    if(oud.length===nieuw.length)oud.forEach((o,i)=>{const n=nieuw[i]; if(o!==n&&!oud.includes(n))['medewerkers','materieel','werken','klussen'].forEach(c=>list(c).filter(r=>r.vestiging===o).forEach(r=>save(c,{...r,vestiging:n})))});
    settings.vestigingen=nieuw; saveSettings(); toast('Vestigingen opgeslagen'); render()}
  else if(a==='poolallev'){ui.poolAlleV=!ui.poolAlleV;render()}
  else if(a==='skillsave'){settings.skills=[...new Set(document.getElementById('set_skills').value.split('\n').map(s=>s.trim()).filter(Boolean))];saveSettings();toast('Vaardigheden opgeslagen')}
  else if(a==='vbwis'){ if(!ui.vbConfirm){ui.vbConfirm=true;render();return} COLS.forEach(c=>list(c).filter(x=>x.voorbeeld).forEach(x=>del(c,x.id))); ui.vbConfirm=false; toast('Voorbeelden verwijderd') }
});
app.addEventListener('dblclick',e=>{
  const t=e.target.closest('.track[data-mw]'); if(!t||e.target.closest('.blok'))return;
  const h=Math.max(PBA(),Math.min(23,Math.floor((e.clientX-t.getBoundingClientRect().left)/HW())+PBA()));
  if(absMs(ui.datum,h)<Date.now()){verledenToast();return}
  const k={id:uid(),titel:'',klantId:'',datum:ui.datum,start:h,duur:Math.min(4,24-h),medewerkers:t.dataset.mw==='_none'?[]:[t.dataset.mw],materieel:[],artikelen:[],tariefId:'',kleur:'k8',omschrijving:'',instructies:'',vestiging:curVest()||''};
  save('klussen',k); openEditor(k.id);
});
app.addEventListener('input',e=>{
  const t=e.target;
  if(ui.tab==='werken'&&ui.werkEdit&&(t.dataset.w||t.dataset.nk||t.dataset.b||t.dataset.ordnr!=null||t.dataset.wverhuur!=null||t.dataset.al!=null||(t.dataset.tl!=null&&t.dataset.f==='opm'))){werkInput(t);return}
  if(t.id==='werkq'){ui.werkQ=t.value;render();return}
  if(t.id==='klantq'){ui.klantQ=t.value;render();return}
  if(t.dataset.lq){ui.lq=ui.lq||{}; ui.lq[t.dataset.lq]=t.value; const pos=t.selectionStart; render(); const n=document.getElementById(t.id); if(n){n.focus(); n.setSelectionRange(pos,pos)} return}
  if(t.id==='poolq'){ui.q=t.value;const pos=t.selectionStart;render();const n=document.getElementById('poolq');n.focus();n.setSelectionRange(pos,pos)}
  if(t.id==='wbq'){ui.wbFilter.q=t.value;render()}
});
app.addEventListener('change',e=>{
  const t=e.target, d=t.dataset;
  if(ui.tab==='werken'&&ui.werkEdit){ if(werkInput(t))render(); return }
  if(t.id==='datumkies'&&t.value){ui.datum=t.value;render();return}
  if(t.id==='wbst'){ui.wbFilter.status=t.value;render();return}
  if(t.id==='wbmw'){ui.wbFilter.mw=t.value;render();return}
  if(d.col){const r=get(d.col,d.id); if(!r)return; let v=t.value; if(d.t==='num')v=parseFloat(String(v).replace(',','.'))||0; save(d.col,{...r,[d.f]:v}); return}
  if(d.skill){const r=get('medewerkers',d.id); const s=new Set(r.skills||[]); t.checked?s.add(d.skill):s.delete(d.skill); save('medewerkers',{...r,skills:[...s]}); return}
  if(d.psel){ ui.printSel=ui.printSel||new Set(); t.checked?ui.printSel.add(d.psel):ui.printSel.delete(d.psel); render(); return }
  if(d.pselall){ const dd=pDag(); ui.printSel=new Set(); if(t.checked)wbBatch(addDays(dd,-1),dd).filter(k=>bonMensen(k).length).forEach(k=>bonMensen(k).forEach(m=>ui.printSel.add(k.id+'|'+m))); render(); return }
  if(d.retour){ const w=get('werkbonnen',d.retour); if(!w)return; if(t.checked){ if(w.status!=='Retour'&&w.status!=='Verwerkt'&&w.status!=='Vervallen')save('werkbonnen',{...w,status:'Retour',retourOp:new Date().toISOString(),statusVoorRetour:w.status}) }
    else if(w.status==='Retour'){ const n={...w,status:w.statusVoorRetour||'Uitgereikt'}; delete n.retourOp; delete n.statusVoorRetour; save('werkbonnen',n) }
    const x=document.getElementById('scanin'); if(x)x.focus(); return }
  if(d.setmin){settings[d.setmin]=Math.max(0,parseFloat(t.value)||0)/60; saveSettings(); toast('Standaard reistijd opgeslagen'); return}
  if(d.setnum){settings[d.setnum]=Math.max(1,parseInt(t.value)||60); saveSettings(); return}
  if(d.wbsetstat){const w=get('werkbonnen',d.wbsetstat); save('werkbonnen',{...w,status:t.value}); toast(w.nummer+' · '+t.value)}
  if(d.wbsel){ const S=ui.wbSel instanceof Set?ui.wbSel:(ui.wbSel=new Set()); t.checked?S.add(d.wbsel):S.delete(d.wbsel); render(); return }
  if(d.wbselall){ const S=ui.wbSel=new Set(); if(t.checked)document.querySelectorAll('input[data-wbsel]').forEach(x=>S.add(x.dataset.wbsel)); render(); return }
});
/* eerst de klik laten afhandelen, dan pas opnieuw tekenen: zo gaat een klik na het typen nooit verloren */
let muisNeer=false, naKlikRij=[];
document.addEventListener('pointerdown',()=>{muisNeer=true},true);
document.addEventListener('pointerup',()=>{ setTimeout(()=>{muisNeer=false; const r=naKlikRij; naKlikRij=[]; r.forEach(f=>f())},0) },true);
function naKlik(fn){ if(muisNeer)naKlikRij.push(fn); else setTimeout(fn,0) }
function ukNaRender(){ naKlik(()=>{ const id=document.activeElement&&document.activeElement.id; render(); if(id){const el=document.getElementById(id); if(el&&el.focus){el.focus(); if(el.select&&el.tagName==='INPUT')try{el.select()}catch(e){}}} }) }
document.addEventListener('change',e=>{ const t=e.target, d=t.dataset||{};
  if(d.uk){ const [id,f]=d.uk.split('|'); let v=t.value;
    if(['vertrek','aankomst','vertrekWerk','terug'].includes(f)){ if(v.trim()===''){v=''} else { const m=tMin(v); if(m==null){toast('Tijd “'+v+'” niet herkend: typ bijv. 07:30 of 730'); t.classList.add('fout'); return} v=kTxt(m) } }
    else if(['pauze','laden','wacht'].includes(f)){ v=v.trim()===''?0:Math.max(0,Math.round(getal(v))) }
    ukBonZet(id,{[f]:v}); ukNaRender(); return }
  if(d.ukd){ const [id,f]=d.ukd.split('|'), m=durMin(t.value); if(t.value.trim()!==''&&m==null){toast('Uren niet herkend: typ bijv. 8:00 of 7:45'); return} ukBonZet(id,{[f]:m==null?undefined:m}); ukNaRender(); return }
  if(d.ukm){ const i=d.ukm.indexOf('|'), key=d.ukm.slice(0,i), sl=d.ukm.slice(i+1), m=durMin(t.value), r=ukRec(key), mm={...(r.matMin||{})}; if(m==null)delete mm[sl]; else mm[sl]=m; save('urenstaten',{...r,matMin:mm}); ukNaRender(); return }
  if(d.ukx){ const [key,i,f]=d.ukx.split('|'), r=ukRec(key), ex=JSON.parse(JSON.stringify(r.extra||[])); if(!ex[+i])return; ex[+i][f]=f==='oms'?t.value:(t.value===''?'':Math.max(0,getal(t.value))); save('urenstaten',{...r,extra:ex}); ukNaRender(); return }
});
document.addEventListener('change',e=>{ const t=e.target; if(t.dataset&&t.dataset.dstar){const w=get('werkbonnen',t.dataset.dstar); if(w){save('werkbonnen',{...w,tariefId:t.value}); dsT=-1; toast(w.nummer+' · tarief '+((get('tarieven',t.value)||{}).naam||''))} return} if(t.dataset&&t.dataset.toesl){const [i,f]=t.dataset.toesl.split('|'), T=toeslagen(); if(T[+i]){T[+i][f]=Math.max(0,Math.min(300,getal(t.value))); saveSettings(); toast('Toeslag '+T[+i].naam+' opgeslagen')} return}
  if(t.dataset&&t.dataset.setpct){settings[t.dataset.setpct]=Math.max(0,Math.min(500,getal(t.value))); saveSettings(); toast('Instelling opgeslagen'); return} });
layer.addEventListener('change',e=>{ const t=e.target; if(!t.dataset||!t.dataset.wbsetstat)return; const w=get('werkbonnen',t.dataset.wbsetstat); if(!w)return; const n={...w,status:t.value}; if(t.value==='Vervallen'){n.vervallenOp=new Date().toISOString(); n.vervalReden='Met de hand op Vervallen gezet'} else {delete n.vervallenOp; delete n.vervalReden} save('werkbonnen',n); if(typeof wbBekijkVernieuw==='function')wbBekijkVernieuw(w.id); toast(w.nummer+' staat nu op '+t.value) });
setInterval(()=>{ if(ui.tab==='planning'&&ui.datum===vandaag()&&!drag&&!draft)rerender() },60000);

start();
