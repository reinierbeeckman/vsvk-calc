<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>VSVK Planning</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Overpass:wght@400;600;700&family=Overpass+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* =====================================================================
   VSVK HUISSTIJL · design tokens (brand guide VSVK 2020)
   Dit blok is de enige bron voor kleur, letter, ruimte en vorm.
   Regels voor elke aanpassing of uitbreiding van de app:
   1. Gebruik ALLEEN de variabelen hieronder (var(--...)), nooit losse #hex-kleuren.
   2. Merkkleuren: zwart var(--vsvk-zwart), wit var(--vsvk-wit), oranje var(--signal) (= veiligheid/actie).
      Rustkleuren: beige var(--beige), licht beige var(--beige-light), licht grijs var(--vsvk-grijs-licht).
      Oranje is voor de ene belangrijkste actie, actieve tab en signalen; niet als vlakvulling.
   3. Koppen, tabs en knoppen: Arial Black (--f-display), altijd KAPITALEN.
      Lopende tekst: Interstate volgens de guide; in de app Overpass als vrij beschikbare vervanger (--f-body).
   4. Vorm: hoekig (radius 0), lijnen 1px (--line) of 1,5px (--bw) bij invoer en kaders.
   5. Stijlelementen: "blok" = oranje verticaal balkje links van een titel (.pagehead h1, .ukkop h4);
      "pijl" = beige vlak met schuine afsnede rechts (.pagehead). Knop primair = oranje met witte kapitalen.
   6. Statuskleuren: ok (groen), warn (oker), danger (rood), info (blauw = alleen bekijken / gedigitaliseerd),
      paars (inkoop vastgesteld). Altijd met de -soft variant als achtergrond.
   7. Tone of voice: kort, krachtig, recht door zee. Geen uitroeptekens, geen vakjargon zonder uitleg.
   Een levend overzicht staat in de app onder Lijsten › Huisstijl.
   ===================================================================== */
/* Layout: witte kopbalk met logo, beige band met schuine afsnede, strak en hoekig. Planbord als tijdlijn: medewerkers als rijen, 24 uurkolommen, klussen als blokken. */
:root{
  /* merkkleuren (vast, ook in donkere modus) */
  --vsvk-zwart:#1a1a1a; --vsvk-wit:#ffffff; --vsvk-oranje:#ff4e02; --vsvk-beige:#dbd7cd; --vsvk-beige-licht:#edebe6; --vsvk-grijs-licht:#f5f5f5;
  /* vorm en ruimte */
  --radius:0; --bw:1.5px; --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  /* afgeleide app-kleuren */
  --signal-hover:#e04400; --line-strong:#b9b2a6; --info:#1f5f99; --info-soft:#e8f0f8; --paars:#5b3fa0; --paars-soft:#f1edf9; --warn-line:#d9b26a; --danger-line:#e0a0a0;
  --bg:#f3f2ef; --surface:#ffffff; --surface-2:#edebe6; --ink:#1a1a1a; --muted:#5d5a54; --line:#dbd7cd; --line-soft:#ebe8e1;
  --signal:#ff4e02; --signal-ink:#ffffff; --signal-soft:#ffe3d6; --danger:#b3261e; --danger-soft:#fbe4e2; --ok:#1e7a46; --ok-soft:#dff1e6; --warn:#9a6400; --warn-soft:#fbefd5;
  --beige:#dbd7cd; --beige-light:#edebe6; --night:rgba(26,26,26,.045); --head:#ffffff; --logo-ink:#1a1a1a; --th-bg:#1a1a1a; --th-ink:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.12),0 6px 20px rgba(0,0,0,.08);
  --k1:#ff4e02; --k2:#2f6fb5; --k3:#2f8a5b; --k4:#8b5cc7; --k5:#c48a12; --k6:#c2416b; --k7:#3d8f99; --k8:#5d5a54;
  --f-display:"Arial Black","Archivo Black","Arial Bold",Arial,sans-serif;
  --f-body:"Overpass",Arial,"Helvetica Neue",sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,Menlo,Consolas,monospace;
  --hw:56px; --lane:46px; --namew:210px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121212; --surface:#1b1b1b; --surface-2:#252523; --ink:#f4f3f0; --muted:#aaa69e; --line:#36342f; --line-soft:#2a2926;
  --signal-soft:#3a1d10; --danger:#ff8a80; --danger-soft:#3b1a17; --ok:#62c48d; --ok-soft:#163223; --warn:#e8b54f; --warn-soft:#3a2d10;
  --beige:#2c2a26; --beige-light:#22211e; --night:rgba(255,255,255,.035); --head:#1b1b1b; --logo-ink:#ffffff; --th-bg:#34322e; --th-ink:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.4); --signal-hover:#ff6a2a; --line-strong:#55524b; --info:#8fb8e6; --info-soft:#1c2a38; --paars:#b9a3ec; --paars-soft:#2a2238; --warn-line:#8a6a2a; --danger-line:#7a3a3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1b1b1b; --surface-2:#252523; --ink:#f4f3f0; --muted:#aaa69e; --line:#36342f; --line-soft:#2a2926;
  --signal-soft:#3a1d10; --danger:#ff8a80; --danger-soft:#3b1a17; --ok:#62c48d; --ok-soft:#163223; --warn:#e8b54f; --warn-soft:#3a2d10;
  --beige:#2c2a26; --beige-light:#22211e; --night:rgba(255,255,255,.035); --head:#1b1b1b; --logo-ink:#ffffff; --th-bg:#34322e; --th-ink:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.4); --signal-hover:#ff6a2a; --line-strong:#55524b; --info:#8fb8e6; --info-soft:#1c2a38; --paars:#b9a3ec; --paars-soft:#2a2238; --warn-line:#8a6a2a; --danger-line:#7a3a3a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
body.dragging{cursor:grabbing;user-select:none}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1800px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--head);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;padding-block:12px 4px}
.brand{display:flex;align-items:center;gap:14px}
.logo-svg{display:block;height:26px;width:auto}
.brand span{font:700 11.5px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line);padding-left:14px}
.mode{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.mode i{width:8px;height:8px;background:var(--ok);display:inline-block}
.mode.local i{background:var(--warn)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:400 12.5px var(--f-display);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:10px 12px 11px;border-bottom:4px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
nav.tabs button:hover{color:var(--ink)}
nav.tabs .cnt{font:600 11px var(--f-mono);background:var(--signal);color:var(--vsvk-wit);padding:0 5px;margin-left:6px;vertical-align:1px}
main{padding-block:16px 60px;display:grid;gap:16px}
.pagehead{background:var(--beige);padding:20px 120px 18px 22px;clip-path:polygon(0 0,100% 0,calc(100% - 90px) 100%,0 100%)}
.pagehead h1{font:400 clamp(22px,3vw,32px)/1.1 var(--f-display);text-transform:uppercase;margin:0;border-left:6px solid var(--signal);padding-left:14px;text-wrap:balance}
.pagehead p{margin:6px 0 0 20px;color:var(--muted);max-width:75ch}
h2{font:400 16px/1.2 var(--f-display);text-transform:uppercase;margin:0;border-left:5px solid var(--signal);padding-left:10px;text-wrap:balance}
h3{font:400 12.5px/1.2 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin:0}
.panel>*,main>*,.board>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);padding:14px;display:grid;gap:12px;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:0;padding:5px 7px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.num,input.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
input.num{text-align:right}
.btn{font:700 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:6px 12px;border-radius:0;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--ink);color:var(--surface)}
.btn.primary{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.btn.primary:hover{background:var(--signal-hover);border-color:var(--signal-hover);color:var(--vsvk-wit)}
.btn.sm{padding:3px 8px;font-size:11px;border-width:1.5px}
.btn.ghost{border-color:transparent;color:var(--muted);padding:4px 6px}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:var(--vsvk-wit)}
.btn[data-confirm="1"]{background:var(--danger);border-color:var(--danger);color:var(--vsvk-wit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{color:var(--muted);font-size:12.5px;margin:0;max-width:75ch}
.chip{display:inline-block;font:600 10.5px/1.5 var(--f-body);text-transform:uppercase;letter-spacing:.05em;padding:0 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.vb{border-style:dashed}
.chip.st-Aangemaakt{border-color:var(--muted)}
.chip.st-Uitgereikt{border-color:var(--info);color:var(--info)}
.chip.st-Retour{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip.st-Verwerkt{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.sw{position:relative;width:38px;height:20px;border:1.5px solid var(--muted);background:var(--surface-2);cursor:pointer;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;background:var(--muted);transition:left .15s}
.sw[aria-checked="true"]{background:var(--signal);border-color:var(--signal)}
.sw[aria-checked="true"]::after{left:20px;background:var(--vsvk-wit)}
@media (prefers-reduced-motion:reduce){.sw::after{transition:none}}
.swl{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.scroll{overflow-x:auto}
table.list{border-collapse:collapse;width:100%}
table.list th{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.05em;background:var(--th-bg);color:var(--th-ink);text-align:left;padding:7px 6px;white-space:nowrap}
table.list td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list td input,table.list td select{padding:4px 6px;background:transparent;border-color:transparent}
table.list td input:hover,table.list td select:hover{border-color:var(--line)}
table.list td input:focus,table.list td select:focus{background:var(--surface-2)}
table.list tr.off td{opacity:.55}
table.list td.c{text-align:center}
table.list th.c{text-align:center}
table.list th.sk{height:110px;text-align:center;padding:8px 4px;vertical-align:bottom}
table.list th.sk span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;text-align:left}
table.list input[type=checkbox]{width:18px;height:18px;accent-color:var(--signal);cursor:pointer}
.empty{padding:22px;color:var(--muted);text-align:center;border:1px dashed var(--line)}
.notice{background:var(--signal-soft);border-left:6px solid var(--signal);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* ---------- planbord ---------- */
.planner{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.pool{background:var(--surface);border:1px solid var(--line);position:sticky;top:110px;display:grid;grid-template-rows:auto auto minmax(0,1fr);max-height:calc(100vh - 130px);min-width:0}
.pool-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;border-bottom:1px solid var(--line);background:var(--surface)}
.pool-tabs button{font:400 12px var(--f-display);text-transform:uppercase;letter-spacing:.03em;padding:11px 6px;background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.pool-tabs button:hover{background:var(--beige-light)}
.pool-tabs button[aria-selected="true"]{background:rgba(255,78,2,.09);color:var(--ink);border-color:var(--signal);box-shadow:inset 0 -3px 0 var(--signal);font-weight:700}
.pool-tabs button{border-color:var(--line);box-shadow:0 1px 2px rgba(0,0,0,.07)}
.pool-tabs button .pn{font:600 10.5px var(--f-mono);opacity:.7}
.pool-search{padding:8px;display:grid;gap:6px}
.pool-list{overflow-y:auto;padding:0 8px 8px;display:grid;gap:5px;align-content:start}
.pi{border:1px solid var(--line);background:var(--surface);padding:6px 8px 6px 10px;cursor:grab;touch-action:pan-y;display:grid;gap:1px;position:relative;user-select:none}
.pi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.pi:hover{border-color:var(--ink)}
.pi:hover::before{background:var(--signal)}
.pi b{font-weight:700;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi small{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .sk{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.pi .sk .chip{font-size:9.5px;padding:0 4px}
.pi.busy small.load{color:var(--signal);font-weight:600}
.pi.busy b{font-weight:400;color:var(--muted)}
.pi.pimw{gap:0;padding:5px 8px 5px 10px}.pi.pimw b{font-weight:700;color:var(--ink)}
.pi small.load{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pi small.st-besch,.rhst.st-besch{color:var(--ok)}.pi small.st-gepland,.rhst.st-gepland{color:var(--signal)}.pi small.st-afw,.rhst.st-afw{color:var(--danger)}
.rhst{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi.busy{background:var(--surface-2)}
.pool.dropzone{outline:3px dashed var(--danger);outline-offset:-3px}
.pool.dropzone .pool-list::before{content:'Laat los om van de klus te halen';display:block;padding:10px;margin:6px;background:var(--danger-soft);color:var(--danger);font-weight:700;text-align:center}
.pool-foot{padding:8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}

.board{display:grid;gap:10px;min-width:0}
.daybar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--surface);border:1px solid var(--line);padding:8px 10px}
.daybar .nav{display:flex;align-items:stretch}
.daybar .nav .btn{border-width:1.5px;padding:5px 10px}
.daybar .nav .btn+.btn{margin-left:-1.5px}
.daybar input[type=date]{width:auto;font-family:var(--f-mono);padding:4px 6px}
.daylabel{display:grid;line-height:1.15}
.daylabel strong{font:400 17px var(--f-display);text-transform:uppercase}
.daylabel small{color:var(--muted);font-size:12px}
.stats{display:flex;gap:16px;margin-left:auto;flex-wrap:wrap}
.stats div{display:grid;line-height:1.1}
.stats small{font:600 10px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stats b{font:600 16px var(--f-mono);font-variant-numeric:tabular-nums}
.stats b.bad{color:var(--danger)}
.zoom{display:flex}
.zoom button{font:600 11px var(--f-body);border:1.5px solid var(--line);background:var(--surface);color:var(--muted);padding:4px 8px;cursor:pointer}
.zoom button+button{margin-left:-1.5px}
.zoom button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);position:relative}

.gridscroll{overflow:auto;background:var(--surface);border:1px solid var(--line);max-height:calc(100vh - 200px);position:relative}
.grid{min-width:calc(var(--namew) + var(--hw) * var(--uren,24));position:relative}
.grow{display:grid;grid-template-columns:var(--namew) calc(var(--hw) * var(--uren,24));border-bottom:1px solid var(--line)}
.grow.hdr{position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:2px solid var(--ink)}
.grow.hdr .rh{font:400 11px var(--f-display);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:end;padding:6px 10px}
.hours{display:grid;grid-template-columns:repeat(var(--uren,24),var(--hw))}
.hours span{font:600 11px var(--f-mono);color:var(--muted);padding:8px 0 5px 4px;border-left:1px solid var(--line-soft);font-variant-numeric:tabular-nums}
.hours span.night{background:var(--night)}
.hours span.now{color:var(--signal)}
.rh{position:sticky;left:0;z-index:3;background:var(--surface);border-right:2px solid var(--line);padding:6px 10px;display:grid;align-content:center;gap:1px;min-width:0}
.rh b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rh small{color:var(--muted);font-size:11px;display:flex;gap:8px;white-space:nowrap;overflow:hidden}
.rh small .u{font-family:var(--f-mono)}
.rh small .u.over{color:var(--danger);font-weight:600;flex:none}
.rh.busy b{font-weight:400;color:var(--muted)}
.sect .st{position:sticky;left:10px;display:inline-flex;align-items:center;gap:10px}
.sect{display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--beige-light);border-bottom:1px solid var(--line);font:400 11.5px var(--f-display);text-transform:uppercase;letter-spacing:.04em;width:calc(var(--namew) + var(--hw) * var(--uren,24))}
.sect small{font:400 11.5px var(--f-body);text-transform:none;letter-spacing:0;color:var(--muted)}
.track{position:relative;min-height:calc(var(--lanes,1) * var(--lane) + 8px);
  background-image:repeating-linear-gradient(to right,var(--line-soft) 0 1px,transparent 1px var(--hw)),linear-gradient(to right,var(--night) 0 calc(var(--hw) * 6),transparent calc(var(--hw) * 6) calc(var(--hw) * 18),var(--night) calc(var(--hw) * 18))}
.track.mat{min-height:calc(var(--lanes,1) * var(--mlane,32px) + 8px)}
.track.hover{box-shadow:inset 0 0 0 2px var(--signal)}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--signal);z-index:2;pointer-events:none}
.blok{position:absolute;height:calc(var(--lane) - 4px);background:var(--surface);border:1px solid var(--kc);border-left:5px solid var(--kc);box-shadow:0 1px 1px rgba(0,0,0,.06);cursor:grab;touch-action:none;overflow:hidden;padding:3px 10px 3px 6px;display:grid;align-content:start;gap:0;z-index:1;user-select:none}
.blok::before{content:"";position:absolute;inset:0;background:var(--kc);opacity:.1;pointer-events:none}
.blok:hover{box-shadow:var(--shadow);z-index:2}
.blok b{font-size:12px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative}
.blok small{font-size:11px;color:var(--muted);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative}
.blok .tags{display:flex;gap:4px;position:absolute;right:12px;top:3px}
.blok .tags span{font:700 11.5px/1.35 var(--f-mono);background:var(--surface);border:1px solid var(--line);padding:0 4px;color:var(--ink)}
.blok .tags span.bad{border-color:var(--danger);color:var(--danger)}
.blok.conflict{outline:2px dashed var(--danger);outline-offset:-2px}
.blok.sel{box-shadow:0 0 0 2px var(--ink)}
.blok.target{box-shadow:0 0 0 3px var(--signal)}
.blok.dim{opacity:.35}
.blok .rz{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;touch-action:none;z-index:2}
.blok .rz::after{content:"";position:absolute;right:2px;top:30%;bottom:30%;border-left:2px dotted var(--muted)}
.blok.matb{height:28px;cursor:pointer;padding:2px 6px;touch-action:auto}
.blok.matb b{font-size:11px}
.blok .cont{position:absolute;right:0;top:0;bottom:0;width:10px;background:repeating-linear-gradient(135deg,var(--kc) 0 3px,transparent 3px 6px);opacity:.6}

<script>
/* ===== prototype: testdatum — doe alsof het een andere dag is (alleen in deze browser) ===== */
const ECHT_DATE=Date; let testOff=0, testTd='';
function testZet(td){ testOff=0; testTd=''; if(td&&/^\d{4}-\d{2}-\d{2}$/.test(td)){ const n=new ECHT_DATE(), doel=new ECHT_DATE(+td.slice(0,4),+td.slice(5,7)-1,+td.slice(8,10),n.getHours(),n.getMinutes(),n.getSeconds(),n.getMilliseconds()); testOff=doel-n; testTd=td }
  try{ if(testTd)localStorage.setItem('vsvk-testdatum',testTd); else localStorage.removeItem('vsvk-testdatum') }catch(e){} }
(function(){ function D(...a){ if(!new.target)return ECHT_DATE(); return a.length?new ECHT_DATE(...a):new ECHT_DATE(ECHT_DATE.now()+testOff) } D.prototype=ECHT_DATE.prototype; Object.setPrototypeOf(D,ECHT_DATE); D.now=()=>ECHT_DATE.now()+testOff; window.Date=D })();
try{ const t=localStorage.getItem('vsvk-testdatum'); if(t)testZet(t) }catch(e){}
/* ================= basis ================= */
const COLS=['artikelen','tarieven','medewerkers','klanten','materieel','werken','klussen','werkbonnen','afwezigheid','memos','aanvragen','leveranciers','dagstaten','facturen','ordernummers','urenstaten','proformas','orderfacturen','selfbills','loonexports','ploegen'];
const S={}; COLS.forEach(c=>S[c]=new Map());
const DEF_SKILLS=['VCA','VCA-VOL','BHV','NEN 3140','GPI','Rijbewijs B','Rijbewijs BE','Rijbewijs C','Rijbewijs CE','Hoogwerker','Heftruck','Autolaadkraan','Graafmachine','Vakman','Vakman 1','Vakman 2'];
const DEF_VEST=['VSVK Pijnacker BV','VSVK Rilland BV','VSVK Wamel BV'];
let settings={vestigingen:DEF_VEST.slice(),skills:DEF_SKILLS.slice(),tarievenOpBon:false,contactOpBon:true,teller:0};
let db=null, downloads=null, live=false;
const KLEUREN=['k1','k2','k3','k4','k5','k6','k7','k8'];
const STATUS=['Aangemaakt','Uitgereikt','Retour','Verwerkt','Vervallen'];
const DAG=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MAAND=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const vandaag=()=>iso(new Date());
const isWeekend=s=>{const g=parseD(s).getDay();return g===0||g===6};
function weeknr(s){const d=parseD(s);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7)}
const langeDatum=s=>{const d=parseD(s);return DAG[d.getDay()]+' '+d.getDate()+' '+MAAND[d.getMonth()]+' '+d.getFullYear()};
const korteDatum=s=>{if(!s)return'';const d=parseD(s);return pad(d.getDate())+'-'+pad(d.getMonth()+1)+'-'+d.getFullYear()};
const tijd=x=>{const m=Math.round(x*60);return pad(Math.floor(m/60))+':'+pad(m%60)};
const uren=x=>(Math.round(x*100)/100).toLocaleString('nl-NL',{maximumFractionDigits:2});
const euro=x=>'€ '+(Number(x)||0).toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2});
const list=c=>[...S[c].values()];
const get=(c,id)=>S[c].get(id);
const byName=(a,b)=>String(a.naam||a.bedrijf||'').localeCompare(String(b.naam||b.bedrijf||''),'nl');
function toast(t,ms,acties){const el=document.getElementById('toast');el.textContent=t;
  const heeft=Array.isArray(acties)&&acties.length; el.classList.toggle('act',!!heeft);
  if(heeft)acties.forEach(([l,fn])=>{const b=document.createElement('button');b.type='button';b.className='tbtn';b.textContent=l;b.addEventListener('click',e=>{e.stopPropagation();el.classList.remove('show','act');clearTimeout(toast.t);fn()});el.appendChild(b)});
  el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show','act'),ms||(heeft?8000:2600))}
document.addEventListener('focusin',e=>{ const t=e.target; if(t&&t.classList&&t.classList.contains('tijdin')){ try{t.select()}catch(_){} t._net=true } });
document.addEventListener('mouseup',e=>{ const t=e.target; if(t&&t._net){ e.preventDefault(); t._net=false } },true);
document.addEventListener('keydown',e=>{ const t=e.target; if(t&&t._net)t._net=false },true);
document.addEventListener('change',e=>{ const t=e.target; if(t&&t.classList&&t.classList.contains('tijdin')){ const x=leesTijd(t.value); if(isNaN(x))toast('Onbekende tijd. Typ bijv. 730, 07:30 of 7.30'); else t.value=tijd(x) } },true);
document.addEventListener('change',e=>{ const t0=e.target; if(t0&&t0.dataset&&t0.dataset.recht){ const [r,o]=t0.dataset.recht.split('|'); rechtZet(r,o,t0.value); return } if(t0&&t0.dataset&&t0.dataset.rechtgroep){ const [r,h]=t0.dataset.rechtgroep.split('|'), g=ONDERDELEN.find(x=>x[0]===h); if(g&&t0.value){ settings[RKEY]=settings[RKEY]||{}; settings[RKEY][r]={...(settings[RKEY][r]||{}),...Object.fromEntries(g[2].map(([o])=>[o,t0.value]))}; saveSettings() } return } });
document.addEventListener('change',e=>{ if(e.target&&e.target.id==='rolsel'){ ui.rol=e.target.value; ls.set('vsvk-rol',ui.rol); render(); toast('Rol: '+rolNaam(ui.rol)); return } if(e.target&&e.target.id==='vestsel'){ ui.vest=e.target.value; ls.set('vsvk-vest',ui.vest); render() } });
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* UI-status (per gebruiker) */
const ui={rol:ls.get('vsvk-rol','beheerder'),tab:'planning',datum:vandaag(),pool:'medewerkers',q:'',lijst:'medewerkers',zoom:ls.get('vsvk-zoom',56),capOpen:ls.get('vsvk-cap',true),pbToon:ls.get('vsvk-pbtoon','alle'),compact:ls.get('vsvk-compact',false),pbDicht:ls.get('vsvk-pbdicht',{}),wbFilter:{status:'',mw:'',q:''},sel:null};
document.documentElement.style.setProperty('--hw',ui.zoom+'px');
const HW=()=>ui.zoom;

/* alleen gewijzigde velden sturen, zodat twee mensen die tegelijk verschillende velden van dezelfde klus wijzigen elkaar niet overschrijven */
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
function dbDiff(path,d){ const b=BASE[path]; if(!b||path.startsWith('meta/'))return null; const keys=new Set([...Object.keys(b),...Object.keys(d)]), up={};
  for(const k of keys){ if(!(k in d))return null; const nv=JSON.stringify(d[k]), ov=JSON.stringify(b[k]); if(nv===ov)continue; if(isObj(d[k])||isObj(b[k]))return null; up[k]=d[k] }
  return up }
function dbWrite(path,data){
  const p=pend[path]||(pend[path]={busy:false,next:undefined});
  p.next=data; if(!p.busy)flush(path);
}
async function flush(path){
  const p=pend[path];p.busy=true;
  while(p.next!==undefined){const d=p.next;p.next=undefined;
    try{ if(d===null){ await db.doc(path).delete(); delete BASE[path] }
      else { const up=dbDiff(path,d); if(up&&!Object.keys(up).length){} else if(up&&typeof db.doc(path).update==='function'){ try{ await db.doc(path).update(up) }catch(e){ if(e&&e.code==='invalid_argument')await db.doc(path).set(d); else throw e } } else await db.doc(path).set(d); BASE[path]=JSON.parse(JSON.stringify(d)) } }
    catch(e){ if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,400+Math.random()*600));try{d===null?await db.doc(path).delete():await db.doc(path).set(d)}catch(e2){fout(e2)}} else fout(e) }
  }
  p.busy=false;
}
function fout(e){
  const c=e&&e.code;
  if(c==='invalid_argument')toast('Opslaan geweigerd: je hebt alleen leesrechten op deze planning.');
  else if(c==='quota_exceeded')toast('De opslag is vol. Verwijder oude werkbonnen of klussen.');
  else toast('Opslaan lukte niet. Probeer het zo opnieuw.');
}
function woVanKlus(k){
  const w=nieuwWerk0(k.datum), rh=+(k.reisHeen??w.reisHeen??0)||0, rt=+(k.reisTerug??w.reisTerug??0)||0;
  const tel=(arr,f)=>{const m=new Map(); arr.forEach(x=>{const v=f(x)||''; m.set(v,(m.get(v)||0)+1)}); return [...m.entries()]};
  Object.assign(w,{id:uid(),klantId:k.klantId||'',van:k.datum,tot:k.datum,eind:'',uitDagen:[],skip:!isWeekend(k.datum)&&w.skip!==false,kleur:k.kleur||(k.klantId?kleurVoorKlant(k.klantId):w.kleur),
    vestiging:k.vestiging||w.vestiging||curVest()||'',kop:k.kop||k.titel||'',titel:k.titel||'',omschrijving:k.omschrijving||'',instructies:k.instructies||'',locatie:k.locatie||'',maps:k.maps||'',
    contactLocatie:k.contactLocatie||'',contactLocatieTel:k.contactLocatieTel||'',reisHeen:rh,reisTerug:rt,aanwezig:k.start+rh,werkuren:Math.max(.5,(+k.duur||8)-rh-rt),
    mensen:(k.medewerkers||[]).length?tel(k.medewerkers,id=>(get('medewerkers',id)||{}).functie).map(([rol,n])=>({id:uid(),aantal:n,rol,skill:'',opm:''})):[{id:uid(),aantal:1,rol:'',skill:'',opm:''}],
    materieel:tel(k.materieel||[],x=>(get('materieel',x.id)||{}).type).map(([type,n])=>({id:uid(),aantal:n,type,mid:''})),
    artikelen:JSON.parse(JSON.stringify(k.artikelen||[])),aangemaakt:new Date().toISOString(),uitKlus:true});
  {const T=wTijden(w); w.vertrek=T.vertrek; w.aanwezig=T.aanwezig; w.werkuren=T.werk; w.reisTerug=T.rt; w.reisHeen=T.rh; w.start=T.vertrek; w.duur=T.duur}

}

function save(c,obj){
  dataV++; if(typeof ondoNoteer==='function')ondoNoteer(c,obj.id);

  const o=JSON.parse(JSON.stringify(obj)); delete o.id;
  const vorig=c==='klussen'?S[c].get(obj.id):null;
  S[c].set(obj.id,{...o,id:obj.id}); dataV++;
  if(vorig){ const nu=new Set(bonMensen(o)); bonMensen(vorig).filter(m=>!nu.has(m)).forEach(m=>{
    list('werkbonnen').filter(x=>x.klusId===obj.id&&x.medewerkerId===m&&(x.status==='Aangemaakt'||x.status==='Uitgereikt')).forEach(x=>{
      const v={...x,status:'Vervallen',vervallenOp:new Date().toISOString(),vervalReden:String(m).startsWith('ext:')?'Ingehuurde kracht van de klus gehaald':'Medewerker van de klus gehaald'}; delete v.id; S.werkbonnen.set(x.id,{...v,id:x.id}); if(live)dbWrite('werkbonnen/'+x.id,v);
      setTimeout(()=>toast(`${x.nummer} vervallen · ${(x.snap&&x.snap.medewerker&&x.snap.medewerker.naam)||mwNaam(m)} staat niet meer op de klus`,4000),50) }) }) }
  if(live)dbWrite(c+'/'+obj.id,o); else lokaalBewaren();
  if(c==='werken'&&orderMigOk)orderSync({...o,id:obj.id});
  if(['klussen','werken','klanten','materieel','medewerkers','artikelen'].includes(c)&&typeof wbAuto==='function')wbAuto();

}
function del(c,id){dataV++; if(typeof ondoNoteer==='function')ondoNoteer(c,id); S[c].delete(id); if(live)dbWrite(c+'/'+id,null); else lokaalBewaren(); rerender()}
/* twee mensen maken tegelijk een WO en krijgen hetzelfde nummer: wie het laatst maakte, krijgt automatisch een nieuw nummer */
function woDubbel(){ const per=new Map(); list('werken').forEach(w=>{ if(!w.nummer)return; if(!per.has(w.nummer))per.set(w.nummer,[]); per.get(w.nummer).push(w) });
  per.forEach(ws=>{ if(ws.length<2)return; ws.sort((a,b)=>String(a.aangemaakt||'').localeCompare(String(b.aangemaakt||''))||String(a.id).localeCompare(String(b.id)));
    ws.slice(1).forEach(w=>{ if(!mijnNieuw.has(w.id))return; mijnNieuw.delete(w.id); const oud=w.nummer, nr=volgendWoNummer(); saveSettings(); save('werken',{...w,nummer:nr,nummerWasDubbel:oud}); setTimeout(()=>toast(`${oud} was tegelijk door een collega gebruikt · jouw werkopdracht heet nu ${nr}`,7000),30) }) }) }

let rq=false;
function rerender(){ if(snel)setTimeout(renderSnel,0); if(rq)return; rq=true; requestAnimationFrame(()=>{rq=false; if(drag&&drag.started){drag.dirty=true;return} render()}) }

async function start(){
  render();
  if(!window.claude||!window.claude.use){return lokaal()}
  try{db=await window.claude.use('db')}catch(e){db=null}
  try{downloads=await window.claude.use('downloads')}catch(e){downloads=null}
  if(!db)return lokaal();
  live=true; setMode(true);
  let eersteKeer=true;
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      const m=new Map(); snap.docs.forEach(d=>{ const x=d.data(); BASE[c+'/'+d.id]=JSON.parse(JSON.stringify(x)); m.set(d.id,{...x,id:d.id}) }); S[c]=m; dataV++; if(c==='werken'&&typeof orderMigOk!=='undefined')orderMigOk=false; if(c==='werken')woDubbel(); rerender();
    },e=>{ if(e.code!=='revoked')toast('De verbinding met de planning is verbroken. Herlaad de pagina.') });
  });
  db.doc('meta/instellingen').onSnapshot(s=>{ if(s.exists){settings={...settings,...s.data()}; if(!Array.isArray(settings.skills))settings.skills=DEF_SKILLS.slice()} rerender() },()=>{});
}
function lokaal(){
  live=false; setMode(false);
  const o=ls.get(LKEY,null);

  COLS.forEach(c=>{S[c]=new Map((src[c]||[]).map(x=>[x.id,x]))}); dataV++; if(typeof orderMigOk!=='undefined')orderMigOk=false;
  if(src.settings)settings={...settings,...src.settings};
  render();
}

/* ================= afgeleide gegevens ================= */
function toevStr(t){t=String(t||'').trim();return !t?'':/^[a-z]/i.test(t)?t:'-'+t.replace(/^-/,'')}
function klantAdres(k){ if(!k)return ''; return k.straat?[k.straat,(k.huisnr||'')+toevStr(k.toev)].filter(Boolean).join(' '):(k.adres||'') }
function klantAdresVol(k){ if(!k)return ''; return [klantAdres(k),[k.postcode,k.plaats].filter(Boolean).join(' '),k.land&&k.land!=='Nederland'?k.land:''].filter(Boolean).join(', ') }
function factuurAdresVol(k){ if(!k||!k.fAfwijkend)return klantAdresVol(k); return [[k.fStraat,(k.fHuisnr||'')+toevStr(k.fToev)].filter(Boolean).join(' '),[k.fPostcode,k.fPlaats].filter(Boolean).join(' ')].filter(Boolean).join(', ') }
function klantContacten(k){ if(!k)return[]; if(Array.isArray(k.contacten)&&k.contacten.length)return k.contacten; return k.contactpersoon?[{id:'c0',naam:k.contactpersoon,functie:'',telefoon:k.telefoon||'',email:k.email||''}]:[] }
const VEST=()=>Array.isArray(settings.vestigingen)&&settings.vestigingen.length?settings.vestigingen:DEF_VEST;
const vestKort=n=>String(n||'').replace(/^VSVK\s+/i,'').replace(/\s+B\.?V\.?$/i,'')||'—';
function curVest(){ if(ui.vest===undefined)ui.vest=ls.get('vsvk-vest',''); if(ui.vest&&!VEST().includes(ui.vest))ui.vest=''; return ui.vest }
const inVest=r=>{const v=curVest(); return !v||!r||!r.vestiging||r.vestiging===v};
function klusVest(k){ return k&&(k.vestiging||(k.werkId&&(get('werken',k.werkId)||{}).vestiging))||'' }
const inVestK=k=>{const v=curVest(); return !v||!klusVest(k)||klusVest(k)===v};
const andereVest=(r,v)=>!!(v&&r&&r.vestiging&&r.vestiging!==v);
function vestMatch(naam){ const n=String(naam||'').toLowerCase().replace(/[^a-z0-9]/g,''); if(!n)return ''; const nk=x=>String(x).toLowerCase().replace(/[^a-z0-9]/g,''); return VEST().find(v=>nk(v)===n)||VEST().find(v=>nk(vestKort(v))===n)||VEST().find(v=>n.includes(nk(vestKort(v))))||'' }
function vestOpts(sel,leeg){ return (leeg?`<option value="">${leeg}</option>`:'')+VEST().map(v=>`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(v)}</option>`).join('') }
function klantenActief(sel){ return list('klanten').filter(k=>k.actief!==false||k.id===sel) }
function splitAdres(a){ const m=/^(.*?)\s+(\d+)\s*[-\s]?([a-zA-Z0-9]{0,4})$/.exec(String(a||'').trim()); return m?{straat:m[1],huisnr:m[2],toev:m[3]||''}:{straat:String(a||''),huisnr:'',toev:''} }
function normPostcode(p){ const x=String(p||'').toUpperCase().replace(/\s+/g,''); return /^\d{4}[A-Z]{2}$/.test(x)?x.slice(0,4)+' '+x.slice(4):String(p||'').trim() }
function standaardBesteller(k){ const cs=klantContacten(k); return cs.find(c=>c.id===k.besteller)||cs[0]||null }
/* nummering B: WO-26-0412 (volgnummer loopt door over de jaren heen, dus altijd uniek) en per opdracht WB-0412-01, -02 … */
const woSeq=nr=>{const x=/^WO-(?:\d{4}|\d{2})-(\d+)$/.exec(String(nr||'').trim()); return x?+x[1]:0};
function woMax(){ return list('werken').reduce((m,w)=>Math.max(m,woSeq(w.nummer)),0) }
function volgendWoNummer(){ const jaar=new Date().getFullYear(), n=Math.max(woMax(),+settings.woTeller||0)+1; settings.woTeller=n; settings.woJaar=jaar; return `WO-${String(jaar).slice(-2)}-${String(n).padStart(4,'0')}` }

  const s=items.slice().sort((a,b)=>a.start-b.start||b.duur-a.duur), ends=[], map=new Map();
  for(const j of s){let i=ends.findIndex(e=>e<=j.start+1e-9); if(i<0){i=ends.length;ends.push(0)} ends[i]=j.start+j.duur; map.set(j.id,i)}
  return{map,n:Math.max(1,ends.length)};
}
function conflicten(d){
  const ks=dagStukken(d), mwC=new Set(), matC=new Set(), matPair=new Set();
  for(let i=0;i<ks.length;i++)for(let j=i+1;j<ks.length;j++){const a=ks[i],b=ks[j]; if(!overlap(klusEnvStuk(a),klusEnvStuk(b)))continue;
    if((a.medewerkers||[]).some(m=>(b.medewerkers||[]).includes(m)&&overlap(kVoor(a,m),kVoor(b,m)))){mwC.add(a.id);mwC.add(b.id)}
    for(const x of (a.materieel||[]))if((b.materieel||[]).some(y=>y.id===x.id)){matC.add(a.id);matC.add(b.id);matPair.add(x.id)}}
  ks.forEach(k=>{ if((k.medewerkers||[]).some(id=>afwBij(id,kVoor(k,id)))||(k.materieel||[]).some(x=>afwBij(x.id,k)))mwC.add(k.id) });
  return{mwC,matC,matPair};
}

const AFW_MW=[['Verlof','k2'],['Ziek','danger'],['Cursus','k4'],['Bijzonder verlof','k5'],['Vrije dag / ATV','k7']];
const AFW_MAT=[['Onderhoud','k5'],['Reparatie','danger'],['Verhuurd','k2'],['Keuring','k4']];
const AFW_KORT={'Verlof':'V','Ziek':'Z','Cursus':'C','Bijzonder verlof':'BV','Vrije dag / ATV':'ATV','Onderhoud':'OH','Reparatie':'R','Verhuurd':'VH','Keuring':'K'};
const afwTypen=soort=>(soort==='mat'?AFW_MAT:AFW_MW).map(x=>x[0]);
const afwKleur=t=>{const x=[...AFW_MW,...AFW_MAT].find(a=>a[0]===t);return x?x[1]:'k8'};
function afwInterval(a,d){ if(!(a.van<=d&&(a.tot||a.van)>=d))return null; if(a.hele!==false)return[0,24]; const st=+a.start||0, e=+a.eind; return[st,e>st?e:24] }
function afwRaakt(a,k){ const e=k.start+k.duur; let iv=afwInterval(a,k.datum); if(iv&&iv[0]<Math.min(e,24)-1e-9&&k.start<iv[1]-1e-9)return true; if(e>24){iv=afwInterval(a,addDays(k.datum,1)); if(iv&&iv[0]<e-24-1e-9)return true} return false }
const afwBij=(id,k)=>list('afwezigheid').find(a=>a.wie===id&&afwRaakt(a,k));
const afwOp=(id,d)=>list('afwezigheid').filter(a=>a.wie===id&&afwInterval(a,d));
const opKlus=(k,id)=>(k.medewerkers||[]).includes(id)||(k.materieel||[]).some(x=>x.id===id);
function afwImpact(a){ return list('klussen').filter(k=>opKlus(k,a.wie)&&afwRaakt(a,k)).sort((x,y)=>x.datum.localeCompare(y.datum)||x.start-y.start) }
function afwPeriode(a){ const t=a.tot&&a.tot!==a.van?korteDatum(a.van)+' t/m '+korteDatum(a.tot):korteDatum(a.van); return t+(a.hele===false?' · '+tijd(+a.start||0)+'–'+tijd(+a.eind||24):'') }
const wieNaam=(soort,id)=>{ if(soort==='mat'){const t=get('materieel',id);return t?t.code+' · '+t.naam:'Onbekend materieel'} return mwNaam(id) };
const signaalDagen=()=>Math.max(1,+settings.signaalDagen||60);
function certStatus(dt,ref){ if(!dt)return 'geen'; ref=ref||vandaag(); if(dt<ref)return 'verlopen'; if(dt<=addDays(ref,signaalDagen()))return 'binnenkort'; return 'ok' }
const certVerval=(m,s)=>((m.certs||{})[s])||'';
const skillGeldig=(m,s,d)=>(m.skills||[]).includes(s)&&(!certVerval(m,s)||certVerval(m,s)>=d);
const keuringOk=(t,d)=>!t.keuring||t.keuring>=d;
function certSig(m,ref){ let st=null, txt=[]; (m.skills||[]).forEach(s=>{const dt=certVerval(m,s); if(!dt)return; const c=certStatus(dt,ref); if(c==='verlopen'){st='verlopen';txt.push(s+' verlopen op '+korteDatum(dt))} else if(c==='binnenkort'){if(!st)st='binnenkort';txt.push(s+' verloopt '+korteDatum(dt))}}); return st?{st,txt:txt.join(', ')}:null }
function keurSig(t,ref){ if(!t.keuring)return null; const c=certStatus(t.keuring,ref); return c==='verlopen'?{st:c,txt:'Keuring verlopen op '+korteDatum(t.keuring)}:c==='binnenkort'?{st:c,txt:'Keuring verloopt '+korteDatum(t.keuring)}:null }
function afwBands(id,d){ return afwOp(id,d).map(a=>{const[st,e]=afwInterval(a,d);return `<div class="afwband" style="left:${st*HW()}px;width:${(e-st)*HW()}px;--kc:var(--${afwKleur(a.type)})"><span>${esc(a.type)}${a.opm?' · '+esc(a.opm):''}</span></div>`}).join('') }
function maandag(d){ return addDays(d,-((parseD(d).getDay()+6)%7)) }
function signalen(){
  const nu=vandaag(), tot=addDays(nu,30), out={certs:[],keur:[],botsing:[],afwNu:[]};
  list('medewerkers').filter(m=>m.actief!==false).forEach(m=>(m.skills||[]).forEach(s=>{const dt=certVerval(m,s); if(!dt)return; const st=certStatus(dt); if(st==='verlopen'||st==='binnenkort')out.certs.push({m,s,dt,st})}));
  list('materieel').filter(t=>t.actief!==false&&t.keuring).forEach(t=>{const st=certStatus(t.keuring); if(st!=='ok')out.keur.push({t,dt:t.keuring,st})});
  list('klussen').filter(k=>k.datum>=nu&&k.datum<=tot).forEach(k=>{
    (k.medewerkers||[]).forEach(id=>{const a=afwBij(id,k); if(a)out.botsing.push({k,id,a})});
    (k.materieel||[]).forEach(x=>{const a=afwBij(x.id,k); if(a)out.botsing.push({k,id:x.id,a})});
  });
  out.botsing.sort((x,y)=>x.k.datum.localeCompare(y.k.datum)||x.k.start-y.k.start);
  out.afwNu=list('afwezigheid').filter(a=>afwInterval(a,nu));
  return out;
}

    <b>${esc(klantNaam(k.klantId))}</b><small>${k.dienstNaam?`<i class="dnlbl">${esc(k.dienstNaam)}</i> `:''}${esc(kopVan(k))||(k.dienstNaam?'':'&nbsp;')}</small>

function hkMatHTML(id){ const t=get('materieel',id); if(!t)return ''; const d=ui.datum, ks=dagKlussen(d).filter(k=>(k.materieel||[]).some(x=>x.id===id)).sort((a,b)=>a.start-b.start), af=afwOp(id,d)[0], ks2=keurSig(t,d);

function hkPlaats(x,y){ const r=hk.getBoundingClientRect(), W=innerWidth, H=innerHeight; let L=x+16, Tp=y+18; if(L+r.width>W-8)L=Math.max(8,x-r.width-16); if(Tp+r.height>H-8)Tp=Math.max(8,y-r.height-14); hk.style.left=L+'px'; hk.style.top=Tp+'px' }

const sk=document.createElement('div'); sk.id='snelkaart'; sk.hidden=true; sk.setAttribute('role','dialog'); sk.setAttribute('aria-label','Klus snel koppelen'); document.body.appendChild(sk);
let snel=null, snelWas=null;
function openSnel(id,mw,el){ const k=get('klussen',id); if(!k)return; hkVerberg(); {const tr=el&&el.closest&&el.closest('.track')?.dataset.mw; if(tr==='_ovz'||!mw||mw==='_none')mw=tr||mw||null} const r=(el&&el.isConnected?el:document.querySelector(`.blok[data-id="${id}"]`))?.getBoundingClientRect()||{left:200,top:200,bottom:240};
  snel={id,mw:mw&&mw!=='_none'&&mw!=='_ovz'?mw:null,ovz:mw==='_ovz',r:{l:r.left,t:r.top,b:r.bottom},pick:null}; renderSnel() }
function sluitSnel(){ if(!snel)return; snel=null; sk.hidden=true; sk.innerHTML='' }

  const nog=[...v.mensen.filter(x=>(+x.line.aantal||0)>x.ids.length).map(x=>((+x.line.aantal||0)-x.ids.length)+'× '+lijnNaam(x.line)),...v.materieel.filter(x=>(+x.line.aantal||0)>x.ids.length).map(x=>((+x.line.aantal||0)-x.ids.length)+'× '+matLijnNaam(x.line))];

function skKoppel(i,mw){ const k=get('klussen',snel.id); if(!k||!k.materieel||!k.materieel[i])return; const mats=k.materieel.map((x,j)=>j===i?{...x,mw}:x), t=get('materieel',mats[i].id);

/* Werkbonnen-batch: dagdiensten van de gekozen dag(en) + nachtdiensten die de avond ervoor beginnen.

const wbGrens=()=>{const g=+settings.wbGrens; return g>0&&g<24?g:18};

  .sort((a,b)=>a.datum.localeCompare(b.datum)||a.start-b.start) }

    ${tm.length?`<button class="btn primary" data-act="wbmaakdag" data-van="${addDays(D,-1)}" data-tot="${D}">Werkbonnen maken (${tm.length})</button>`:''}

function doorDatums(d,n,skip){const out=[];let c=d;while(out.length<n){c=addDays(c,1); if(skip&&isWeekend(c))continue; out.push(c)}return out}
function lockEditor(){

  dr.querySelector('.dbody').insertAdjacentHTML('afterbegin',st==='voorbij'?`<div class="warnbox geel"><b>Deze klus is voorbij</b><br>De planning kan niet meer gewijzigd worden. Leg afwijkingen vast op de werkbon.</div>`:`<div class="warnbox geel"><b>Deze klus is al begonnen</b><br>Datum en starttijd liggen vast. Mensen, materieel en de eindtijd kun je nog aanpassen.</div>`);
  if(st==='voorbij'){ dr.querySelectorAll('.dbody input,.dbody select,.dbody textarea,.dbody button').forEach(x=>x.disabled=true); dr.querySelectorAll('[data-act="opslaan"],[data-act="klusdel"]').forEach(x=>x.hidden=true) }
  else { ['e_datum','e_aanw','e_rh'].forEach(id=>{const x=document.getElementById(id); if(x)x.disabled=true}); dr.querySelectorAll('[data-act="klusdel"]').forEach(x=>x.hidden=true) }
}
function readDraft(){
  const v=id=>{const el=document.getElementById(id);return el?el.value:undefined};
  if(!draft)return;
  draft.klantId=v('e_klant')??draft.klantId; draft.titel=v('e_titel')??draft.titel; draft.kop=v('e_kop')??draft.kop; draft.datum=v('e_datum')||draft.datum;
  if(v('e_aanw')!=null){ const locD=v('e_datum')||locDatum(draft), aw=(x=>isNaN(x)?kTijden(draft).aanwezig%24:x)(leesTijd(v('e_aanw'))), rh=Math.max(0,(parseFloat(v('e_rh'))||0)/60), wk=Math.max(.25,Math.min(24,parseFloat(String(v('e_werk')).replace(',','.'))||kTijden(draft).werk||1)), rt=Math.max(0,(parseFloat(v('e_rt'))||0)/60), vt=aw-rh;
    draft.datum=vt<0?addDays(locD,-1):locD; draft.start=vt<0?vt+24:vt; draft.reisHeen=rh; draft.reisTerug=rt; draft.duur=Math.min(30,rh+wk+rt) }
  draft.omschrijving=v('e_oms')??draft.omschrijving; draft.instructies=v('e_instr')??draft.instructies; draft.tariefId=v('e_tarief')??draft.tariefId;
  draft.vestiging=v('e_vest')??draft.vestiging;
  draft.locatie=v('e_loc')??draft.locatie;
  draft.maps=v('e_maps')??draft.maps; draft.contactLocatie=v('e_cloc')??draft.contactLocatie; draft.contactLocatieTel=v('e_ctel')??draft.contactLocatieTel;
  if(draft._door){draft._door.n=Math.max(1,Math.min(60,parseInt(v('d_n'))||1))}
}

function cleanKlus(k){const o={...k}; if(o.inhuur)o.inhuur=o.inhuur.map(x=>{const y={...x}; delete y._nieuwLev; return y});delete o._pick;delete o._tijdOpen; if(o.tijden){const t={}; Object.entries(o.tijden).forEach(([m,v])=>{if((o.medewerkers||[]).includes(m))t[m]=v}); o.tijden=t}delete o._confirm;delete o._door;delete o._confirmReeks;return o}

const ordEerste=t=>String(t||'').split(/\s*;\s*/).map(x=>x.trim()).find(Boolean)||'';
/* alle regels van een proforma, met een vaste sleutel per regel */
function pfLijnen(p){ const kl=get('klanten',p.klantId)||{}, verlegd=kl.btwVerlegd!==false, out=[];
  pfRegels(p).forEach(r=>{ const S0=r.snap||{}, ord=ordEerste(r.ordernr), basis={usId:r.id,datum:r.datum,woNr:r.woNr||'',ordWO:ord,kop:r.kop||''};

    (S0.mat||[]).filter(x=>x.bedrag).forEach(x=>out.push({...basis,key:`${r.id}|m|${x.sl}`,soort:'mat',oms:(x.code+' '+x.naam).trim(),qty:x.per==='uur'?x.min:x.aantal,eenheid:x.per,prijs:x.prijs,bedrag:x.bedrag,btwKeus:false}));
    (S0.overig||[]).forEach((x,i)=>{ if(!x.bedrag)return; out.push({...basis,key:`${r.id}|o|${i}`,soort:x.soort,oms:x.oms,qty:x.eenheid==='uur'?Math.round((+x.aantal||0)*60):getal(x.aantal),eenheid:x.eenheid||'st',prijs:getal(x.prijs),bedrag:x.bedrag,btwKeus:x.soort==='art'||x.soort==='ink'}) });
    (S0.extra||[]).forEach((x,i)=>{ if(!x.bedrag)return; out.push({...basis,key:`${r.id}|x|${i}`,soort:'extra',oms:x.oms||'Extra kosten',qty:getal(x.aantal),eenheid:x.eenheid||'st',prijs:getal(x.prijs),bedrag:x.bedrag,btwKeus:true}) }) });

const qTxt=(q,e)=>e==='uur'?dTxt(q):String(r2(q)).replace('.',',')+' '+(e||'');
/* verdeling: delen per regel; het eerste deel krijgt automatisch de rest */
function pfDelen(p,l){ const v=(p.verdeling||{})[l.key]; if(!v||!v.length)return [{order:l.ordWO,qty:l.qty}];
  const rest=v.slice(1).reduce((a,d)=>a+(+d.qty||0),0); return [{order:v[0].order,qty:l.qty-rest},...v.slice(1).map(d=>({order:d.order,qty:+d.qty||0}))] }
function pfVerdeelCheck(p){ const fout=[]; let open=0; pfLijnen(p).forEach(l=>{ const ds=pfDelen(p,l); if(ds.some(d=>!String(d.order||'').trim())){open+=l.bedrag; fout.push(`${datumKort(l.datum)} ${l.oms}: geen ordernummer`)} if(ds.some(d=>d.qty<0)){fout.push(`${datumKort(l.datum)} ${l.oms}: delen zijn samen meer dan de regel`)} });
  return {ok:!fout.length,fout,open:r2(open)} }
/* bedragen per deel, centen kloppen altijd op tot het regelbedrag */
function pfPerOrder(p){ const m=new Map(); pfLijnen(p).forEach(l=>{ const ds=pfDelen(p,l); let rest=l.bedrag;
  ds.forEach((d,i)=>{ const b=i===ds.length-1?r2(rest):r2(l.qty?l.bedrag*d.qty/l.qty:0); rest=r2(rest-b); const o=String(d.order||'').trim()||'(geen ordernummer)';
    if(!m.has(o))m.set(o,{order:o,regels:[],totaal:0}); const g=m.get(o); g.regels.push({...l,qty:d.qty,bedrag:b,deel:ds.length>1}); g.totaal=r2(g.totaal+b) }) });

/* ===== stap 4: looncomponenten per kalendermaand voor de accountant (Loket) ===== */
const MND=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const mndTxt=m=>{const [y,n]=m.split('-').map(Number); return MND[n-1]+' '+y};
const mndPlus=(m,k)=>{let [y,n]=m.split('-').map(Number); n+=k; while(n<1){n+=12;y--} while(n>12){n-=12;y++} return y+'-'+pad(n)};
const LOON_C=[['normaal','Normale uren'],['overuren','Overuren'],['nacht','Uren nacht (18–06)'],['zaterdag','Uren zaterdag'],['zondag','Uren zondag'],['reis','Reisuren'],['Verlof','Verlof'],['Ziek','Ziek'],['Vrije dag / ATV','ATV / vrije dag'],['Bijzonder verlof','Bijzonder verlof'],['Cursus','Cursus']];
const loonContract=m=>(m&&m.contract)||'loondienst';
/* minuten per toeslagsoort: per minuut één soort (zondag gaat voor zaterdag, zaterdag voor nacht), pauze naar rato eruit */
function loonCat(datum,tijdTxt,tot,factor){ const p=String(tijdTxt||'').split('–'); let v=tMin(p[0]), t=tMin(p[1]); if(v==null||t==null)return {nacht:0,zaterdag:0,zondag:0}; while(t<=v)t+=1440;
  const d0=parseD(datum).getDay(), c={nacht:0,zaterdag:0,zondag:0}; for(let m=v;m<t;m++){ const dag=(d0+Math.floor(m/1440))%7, h=((m%1440)+1440)%1440/60; if(dag===0)c.zondag++; else if(dag===6)c.zaterdag++; else if(h>=18||h<6)c.nacht++ }
  const f=(t-v)?(tot/(t-v))*(factor||1):0; Object.keys(c).forEach(k=>c[k]=Math.round(c[k]*f)); return c }
/* alle gewerkte loondienst-dagen (alleen goedgekeurd) in een periode */
function loonDagen(van,tot){ const out=[]; list('urenstaten').forEach(r=>{ if(!ukVast(r)||r.datum<van||r.datum>tot)return; ((r.snap||{}).rows||[]).forEach(x=>{ if(x.contract!=='loondienst'&&x.contract!=='nuluren')return; const tot0=x.bt?x.bt.tot:0, min=x.iMin;
    out.push({mw:x.mw,naam:x.naam,contract:x.contract,datum:r.datum,woNr:r.woNr||'',min,reis:x.bt?Math.round(x.bt.reis*(tot0?min/tot0:1)):0,cat:loonCat(r.datum,x.tijdTxt,tot0,tot0?min/tot0:1)}) }) }); return out }
/* per medewerker per maand: normale uren, overuren (na contracturen per week), toeslaguren, reis, afwezigheid */
function loonMaand(m){ const van=m+'-01', tot=addDays(mndPlus(m,1)+'-01',-1), wVan=maandag(van), wTot=addDays(maandag(tot),6);
  const dagen=loonDagen(wVan,wTot), per=new Map();
  const leeg=(id,naam,c)=>({mw:id,naam,contract:c,normaal:0,overuren:0,nacht:0,zaterdag:0,zondag:0,reis:0,afw:{},dagen:0});
  const wk=new Map(); dagen.forEach(x=>{const k=x.mw+'|'+maandag(x.datum); if(!wk.has(k))wk.set(k,[]); wk.get(k).push(x)});
  wk.forEach(ds=>{ ds.sort((a,b)=>a.datum.localeCompare(b.datum)); const mw=get('medewerkers',ds[0].mw)||{}, cu=+mw.contractUren>0?+mw.contractUren:40, grens=cu*60; let som=0;
    ds.forEach(x=>{ const norm=Math.max(0,Math.min(x.min,grens-som)), over=x.min-norm; som+=x.min; if(x.datum<van||x.datum>tot)return;
      if(!per.has(x.mw))per.set(x.mw,leeg(x.mw,x.naam,x.contract)); const p=per.get(x.mw); p.normaal+=norm; p.overuren+=over; p.nacht+=x.cat.nacht; p.zaterdag+=x.cat.zaterdag; p.zondag+=x.cat.zondag; p.reis+=x.reis; p.dagen++ }) });
  list('medewerkers').filter(mw=>mw.actief!==false&&inVest(mw)&&loonContract(mw)!=='zzp').forEach(mw=>{ const dpw=+mw.contractUren>0?Math.round(+mw.contractUren*60/5):0;
    for(let d=van;d<=tot;d=addDays(d,1)){ const wd=parseD(d).getDay(); afwOp(mw.id,d).forEach(a=>{ if(!LOON_C.some(c=>c[0]===a.type))return; const min=a.hele===false?Math.max(0,Math.round(((+a.eind||0)-(+a.start||0))*60)):(wd===0||wd===6?0:dpw); if(!min)return;
      if(!per.has(mw.id))per.set(mw.id,leeg(mw.id,mw.naam,loonContract(mw))); const p=per.get(mw.id); p.afw[a.type]=(p.afw[a.type]||0)+min }) } });
  return per }
/* wat er bij het salaris van maand m wordt uitbetaald */
function loonUitbetaling(m){ const nu=loonMaand(m), vorig=loonMaand(mndPlus(m,-1)), ids=new Set([...nu.keys(),...vorig.keys()]), rows=[];
  ids.forEach(id=>{ const mw=get('medewerkers',id)||{}, a=nu.get(id), b=vorig.get(id), c=(a||b).contract, naam=mw.naam||(a||b).naam, pnr=mw.personeelsnr||'';
    const r={mw:id,naam,pnr,contract:c,regels:[]}; const zet=(comp,min,maand)=>{ if(min>0)r.regels.push({comp,min,maand}) };
    if(c==='nuluren'){ if(b){ LOON_C.slice(0,6).forEach(([k])=>zet(k,b[k],mndPlus(m,-1))); Object.entries(b.afw).forEach(([k,v])=>zet(k,v,mndPlus(m,-1))) } }
    else { if(a){ zet('normaal',a.normaal,m); Object.entries(a.afw).forEach(([k,v])=>zet(k,v,m)) } if(b){ ['overuren','nacht','zaterdag','zondag','reis'].forEach(k=>zet(k,b[k],mndPlus(m,-1))) } }
    if(r.regels.length)rows.push(r) });
  return rows.sort((x,y)=>x.naam.localeCompare(y.naam,'nl')) }
function loonOpen(m){ const van=mndPlus(m,-1)+'-01', tot=addDays(mndPlus(m,1)+'-01',-1); return [...dsGroepen(d=>d>=van&&d<=tot&&d<=vandaag()).values()].filter(g=>!g.wees&&(()=>{const s=ukStaat(g); return (s.st==='open'||s.st==='klaar')&&s.u.rows.some(r=>r.contract==='loondienst'||r.contract==='nuluren')})()) }
const loonSom=rows=>JSON.stringify(rows.map(r=>[r.mw,r.regels.map(x=>[x.comp,x.min,x.maand])]));
function loonHTML(){ const m=ui.loonMnd||mndPlus(vandaag().slice(0,7),0), rows=loonUitbetaling(m), open=loonOpen(m), exp=list('loonexports').filter(x=>x.maand===m).sort((a,b)=>String(b.op).localeCompare(String(a.op)))[0];

      <span class="acties"><button class="btn primary" data-act="loonexp" ${rows.length?'':'disabled'}>Excel (CSV) voor de accountant</button></span></div>
    ${exp?`<div class="dsmeld ${loonSom(rows)!==exp.som?'warn':'info'}">${loonSom(rows)!==exp.som?'⚠ Gewijzigd sinds de export van ':'Geëxporteerd op '}${(t=>esc(datumKort(t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())))+' '+pad(t.getHours())+':'+pad(t.getMinutes()))(new Date(exp.op))}${exp.door?' door '+esc(exp.door):''}${loonSom(rows)!==exp.som?': stuur de accountant de nieuwe versie.':'.'}</div>`:''}
    ${open.length?`<div class="dsmeld warn">⚠ ${open.length} dag${open.length===1?'':'en'} met loondienst-uren ${open.length===1?'is':'zijn'} nog niet goedgekeurd en ${open.length===1?'telt':'tellen'} niet mee: ${open.sort((a,b)=>a.datum.localeCompare(b.datum)).slice(0,8).map(g=>`<button class="btn link inl" data-act="naaruren" data-m="${g.datum}">${esc(datumKort(g.datum))}${g.wo?' '+esc(g.wo.nummer||''):''}</button>`).join(', ')}.</div>`:''}
    ${rows.length?`<div class="scroll"><table class="list std loontab"><thead><tr><th>Medewerker</th><th>Contract</th>${kols.map(k=>`<th class="r">${esc(naam(k))}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.naam)}</b>${r.pnr?`<small class="num hint" style="display:block">${esc(r.pnr)}</small>`:''}</td><td><span class="chip ct-${r.contract}">${r.contract==='nuluren'?'nuluren':'loondienst'}</span></td>${kols.map(k=>{const xs=r.regels.filter(x=>x.comp===k); return `<td class="r num nw">${xs.length?xs.map(x=>`${dTxt(x.min)}${x.maand!==m?`<small class="hint">${esc(MND[+x.maand.slice(5)-1].slice(0,3))}</small>`:''}`).join('<br>'):'<span class="hint">—</span>'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="empty">Geen looncomponenten voor deze maand.</div>`}
    <p class="hint">Toeslaguren staan in uren, zonder percentage: de accountant past de cao Metaal en Techniek toe. Overuren tellen per week tegen de contracturen (bij een nulurencontract tegen 40 uur).</p>` }

function mapsLink(adres,pin){

  const q=p||String(adres||'').trim(); return q?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`:'';
}

/* ---------- werken & behoefte ---------- */

  tres.forEach(x=>{x.afw=[]; for(const y of (k.materieel||[])){ if(x.ids.length>=(+x.line.aantal||0))break; if(usedT.has(y.id)||afwBij(y.id,k))continue; if(!get('materieel',y.id))continue; x.ids.push(y.id); x.afw.push(y.id); usedT.add(y.id)}});
  (k.inhuur||[]).filter(x=>x.soort==='mens').forEach(x=>{ const r=mres.find(r=>r.ids.length<(+r.line.aantal||0)&&(!r.line.rol||r.line.rol===x.rol)); if(r)r.ids.push('ext:'+x.id) });

function bezetOp(k){const rk=rondKlus(k), mset=new Set(); rk.forEach(o=>(o.medewerkers||[]).forEach(m=>{ if(overlap(kVoor(o,m),k))mset.add(m) })); const others=rk.filter(o=>overlap(o,k)); return{m:mset,t:new Set(others.flatMap(o=>(o.materieel||[]).map(x=>x.id)))}}

function autofill(k,prefer){
  const busy=bezetOp(k); let n=0;

    let need=(+x.line.aantal||0)-x.ids.length; if(need<=0)return;
    const c=list('medewerkers').filter(m=>m.actief!==false&&!andereVest(m,klusVest(k))&&!(k.medewerkers||[]).includes(m.id)&&!busy.m.has(m.id)&&!afwBij(m.id,k)&&mwMatch(m,x.line,k.datum)).sort((a,b)=>pr(b.id)-pr(a.id)||byName(a,b));

/* ---------- ⚡ Vul aan: voorstel met redenen ---------- */
let va=null;
function vaHist(k){ const van=addDays(k.datum,-120), h=new Map(), samen=new Map(), ploeg=new Set(k.medewerkers||[]);
  list('klussen').forEach(o=>{ if(o.id===k.id||o.datum>=k.datum||o.datum<van)return; const ids=[...(o.medewerkers||[]),...(o.materieel||[]).map(x=>x.id)];
    if(o.klantId&&o.klantId===k.klantId)ids.forEach(id=>h.set(id,(h.get(id)||0)+1));
    const mee=(o.medewerkers||[]).filter(m=>ploeg.has(m)); if(mee.length)(o.medewerkers||[]).forEach(m=>{if(!ploeg.has(m)){const c=samen.get(m)||new Map(); mee.forEach(x=>c.set(x,(c.get(x)||0)+1)); samen.set(m,c)}}) });
  return{h,samen} }
function vaWaar(k,id){ const o=rondKlus(k).find(o=>opKlus(o,id)&&overlap(o.medewerkers&&o.medewerkers.includes(id)?kVoor(o,id):o,k)); return o?klantNaam(o.klantId):'' }
function vaKand(k,line,soort,H){
  const v=klusVest(k), uit=[], ok=[], busy=bezetOp(k);
  const pool=soort==='mw'?list('medewerkers').filter(m=>m.actief!==false&&!(k.medewerkers||[]).includes(m.id)&&mwMatch(m,line,k.datum))
                         :list('materieel').filter(t=>t.actief!==false&&!(k.materieel||[]).some(y=>y.id===t.id)&&matMatch(t,line,k.datum));
  pool.forEach(x=>{ const naam=soort==='mw'?x.naam:x.code+' · '+x.naam, a=afwBij(x.id,k);
    if(a){uit.push({id:x.id,naam,reden:a.type.toLowerCase()});return}
    if(soort==='mw'?busy.m.has(x.id):busy.t.has(x.id)){uit.push({id:x.id,naam,reden:'al bij '+(vaWaar(k,x.id)||'andere klus')});return}
    const red=[]; let sc=0; const n=H.h.get(x.id)||0;
    if(n){red.push(n+'× eerder bij deze klant');sc+=Math.min(n,4)*10}
    if(soort==='mw'){const c=H.samen.get(x.id); if(c&&c.size){const [m,cnt]=[...c.entries()].sort((a,b)=>b[1]-a[1])[0]; red.push('vaak samen met '+mwNaam(m).split(' ')[0]); sc+=Math.min(cnt,3)*4}}

    if(v&&andereVest(x,v)){red.push('andere vestiging');sc-=60} else if(v){sc+=5}
    if(!red.length)red.push('beschikbaar');
    ok.push({id:x.id,naam,red,sc}) });

function maakVoorstel(ids){
  const rijen=[], klussen=[], claim=new Map();

    const v=vulling(k); if(!v.open&&!v.openMat)return; const H=vaHist(k), kl={id:k.id,niet:[]}; klussen.push(kl);

      for(let i=0;i<open;i++){ const pick=ok.find(o=>vrij(k,o.id)&&!rijen.some(r=>r.klusId===k.id&&r.keuze===o.id));
        if(pick)claim.set(pick.id,[...(claim.get(pick.id)||[]),k]);

        <span class="vared">${bad.has(i)?'<em class="slecht">staat 2× in dit voorstel</em>':o?o.red.map(t=>`<em class="${t==='andere vestiging'?'let':''}">${esc(t)}</em>`).join(''):''}</span></div>` }).join('');

      ${kl.niet.length?`<div class="vaniet">Niet gekozen: ${kl.niet.slice(0,5).map(u=>`${esc(u.naam)} <i>(${esc(u.reden)})</i>`).join(', ')}</div>`:''}</div>` }).join('');

  <div class="mfoot">${va.terug==='oc'?'<button class="btn" data-act="vaterug" style="margin-right:auto">← Dagcheck</button>':''}<button class="btn" data-act="sluitmodal">Annuleren</button><button class="btn primary" data-act="vaok" ${n&&!bad.size?'':'disabled'}>${n?`${n} plek${n>1?'ken':''} inplannen`:'Niets gekozen'}</button></div>`,'wide vamodal');

function werkDagen(w){const out=[];if(!w.van||w.geannuleerd)return out;const tot=w.tot&&w.tot>=w.van?w.tot:w.van;let d=w.van;const uit=w.uitDagen||[];while(d<=tot&&out.length<120){if(!(w.skip&&isWeekend(d))&&!uit.includes(d))out.push(d);d=addDays(d,1)}return out}

  {const T=wTijden(w); w.vertrek=T.vertrek; w.aanwezig=T.aanwezig; w.werkuren=T.werk; w.reisTerug=T.rt; w.reisHeen=T.rh; w.start=T.vertrek; w.duur=T.duur}

function avZonderAI(tekst){
  const r={besteller:{},mensen:[],materieel:[],onzeker:[],vragen:['Automatisch inlezen (AI) is hier niet beschikbaar: alleen regels als "Datum: …" zijn herkend. Controleer alles.']};

  r.kop=regel('werk|onderwerp|korte omschrijving'); r.omschrijving=regel('omschrijving|wat moet er gebeuren|werkzaamheden'); r.titel=regel('projectnummer|bestelnummer|referentie|po');
  r.locatie=regel('werkadres|locatie|adres'); r.contactLocatie=regel('contact op locatie|aanspreekpunt');
  const d=regel('datum|op|wanneer'), dm=/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/.exec(d); if(dm){const j=dm[3].length===2?'20'+dm[3]:dm[3]; r.van=`${j}-${String(dm[2]).padStart(2,'0')}-${String(dm[1]).padStart(2,'0')}`}
  const t=/(\d{1,2})[:.](\d{2})/.exec(regel('starttijd|aanvang|tijd')); if(t)r.aanwezig=`${String(t[1]).padStart(2,'0')}:${t[2]}`;
  const u=parseFloat(String(regel('uren|werkuren|duur')).replace(',','.')); if(u)r.werkuren=u;
  const p=parseInt(regel('mensen|personen|aantal man')); if(p)r.mensen=[{aantal:p,rol:'',skill:'',tekst:p+' personen'}];
  const kl=list('klanten').find(k=>r.klantNaam&&String(k.bedrijf).toLowerCase().includes(r.klantNaam.toLowerCase()))||list('klanten').find(k=>r.besteller.email&&(k.email===r.besteller.email||klantContacten(k).some(c=>c.email===r.besteller.email)));
  r.klantId=kl?kl.id:null; return r }

  const d=x=>/^\d{4}-\d{2}-\d{2}$/.test(s(x))?s(x):'';

const TGROEP=[['fout','Eerst oplossen','danger','Dubbel geboekt of afwezig: dit klopt nu niet.'],['open','Nog plannen','warn','Er ontbreken mensen of materieel.'],['check','Controleren','k5','Certificaten, keuringen en koppelingen.'],['wb','Afronden: werkbonnen','k2','Alles staat, alleen de werkbonnen nog.'],['vr','Werkvoorraad · inplannen als er ruimte is','k7','Opvulwerk voor klanten zonder vaste datum.'],['info','Ter info','k8','Gegevens om aan te vullen.']];
function taken(van,tot){
  const out=[], dub=new Set(), certAgg=new Map(), wbAgg=new Map();
  const dagen=[]; for(let d=van;d<=tot;d=addDays(d,1))dagen.push(d);
  const wos=new Set();
  dagen.forEach(d=>dagKlussen(d).filter(inVestK).forEach(k=>{
    const wk=werkVan(k), naam=klantNaam(k.klantId)+(kopVan(k)?' · '+kopVan(k):''), nr=wk&&wk.nummer?wk.nummer+' · ':'', tijdTxt=tijd(k.start)+'–'+tijdD(k.start+k.duur);
    const base={datum:d,klusId:k.id,wie:nr+naam,tijd:tijdTxt};
    if(wk)wos.add(wk.id);
    // dubbel geboekt
    rondKlus(k).filter(o=>overlap(o,k)).forEach(o=>{
      (k.medewerkers||[]).filter(m=>(o.medewerkers||[]).includes(m)).forEach(m=>{const key=[k.id,o.id].sort().join('|')+m; if(dub.has(key))return; dub.add(key);
        out.push({...base,groep:'fout',tekst:`${mwNaam(m)} staat dubbel geboekt`,sub:`ook op ${klantNaam(o.klantId)} ${korteDatum(o.datum)}`,acties:[['Klus openen',`data-open="${k.id}"`]]})});
      (k.materieel||[]).filter(x=>(o.materieel||[]).some(y=>y.id===x.id)).forEach(x=>{const key=[k.id,o.id].sort().join('|')+x.id; if(dub.has(key))return; dub.add(key); const t=get('materieel',x.id);
        out.push({...base,groep:'fout',tekst:`${t?t.code:'Materieel'} is dubbel ingezet`,sub:`ook op ${klantNaam(o.klantId)} ${korteDatum(o.datum)}`,acties:[['Klus openen',`data-open="${k.id}"`]]})});
    });
    // afwezig
    (k.medewerkers||[]).forEach(m=>{const a=afwBij(m,k); if(a)out.push({...base,groep:'fout',tekst:`${mwNaam(m)} is afwezig (${a.type.toLowerCase()})`,sub:'maar staat ingepland',acties:[['Vervanging regelen',`data-act="oplossen" data-id="${a.id}"`,'primary']]})});
    (k.materieel||[]).forEach(x=>{const a=afwBij(x.id,k), t=get('materieel',x.id); if(a&&t)out.push({...base,groep:'fout',tekst:`${t.code} is niet beschikbaar (${a.type.toLowerCase()})`,sub:'maar staat ingepland',acties:[['Vervanging regelen',`data-act="oplossen" data-id="${a.id}"`,'primary']]})});
    // open plekken
    const v=vulling(k);
    if(v.open||v.openMat){ const wat=[...v.mensen.filter(x=>(+x.line.aantal||0)>x.ids.length).map(x=>((+x.line.aantal||0)-x.ids.length)+'× '+lijnNaam(x.line)),...v.materieel.filter(x=>(+x.line.aantal||0)>x.ids.length).map(x=>((+x.line.aantal||0)-x.ids.length)+'× '+matLijnNaam(x.line))];
      out.push({...base,groep:'open',tekst:`${v.open+v.openMat} plek${v.open+v.openMat>1?'ken':''} open`,sub:wat.join(', '),acties:[['⚡ Vul aan',`data-act="ovauto" data-id="${k.id}"`,'primary'],['Openen',`data-open="${k.id}"`]]}) }
    else if(!(k.medewerkers||[]).length&&!v.nodig) out.push({...base,groep:'open',tekst:'Nog niemand ingepland',sub:'losse klus zonder medewerker',acties:[['Openen',`data-open="${k.id}"`,'primary']]});
    // certificaten / keuring
    (k.medewerkers||[]).forEach(m=>{const mw=get('medewerkers',m); if(!mw)return; (mw.skills||[]).forEach(sk=>{const dt=certVerval(mw,sk); if(dt&&dt<k.datum){const key=m+'|'+sk; if(!certAgg.has(key))certAgg.set(key,{...base,groep:'check',tekst:`${mw.naam}: ${sk}`,dt,n:0,acties:[['Certificaat bijwerken',`data-kaart="mw:${m}"`]]}); certAgg.get(key).n++}})});
    (k.materieel||[]).forEach(x=>{const t=get('materieel',x.id); if(t&&!keuringOk(t,k.datum))out.push({...base,groep:'check',tekst:`${t.code}: keuring verlopen`,sub:'sinds '+korteDatum(t.keuring),acties:[['Kaart',`data-kaart="mat:${t.id}"`]]}); if(t&&!x.mw&&(k.medewerkers||[]).length&&!matVerhuur(k,x))out.push({...base,groep:'check',tekst:`${t.code} is aan niemand gekoppeld`,sub:'wie neemt het mee?',acties:[['Klus openen',`data-open="${k.id}"`]]})});
    // werkbonnen
    const wbs=list('werkbonnen').filter(w=>w.klusId===k.id&&w.status!=='Vervallen');
    const zonder=(k.medewerkers||[]).filter(m=>!wbs.some(w=>w.medewerkerId===m));
    const oud=wbs.filter(w=>(w.status==='Aangemaakt'||w.status==='Uitgereikt')&&(k.medewerkers||[]).includes(w.medewerkerId)&&w.snap&&w.snap.klus&&(w.snap.klus.start!==k.start||w.snap.klus.duur!==k.duur||w.snap.klus.datum!==k.datum));
    const weg=wbs.filter(w=>(w.status==='Aangemaakt'||w.status==='Uitgereikt')&&!(k.medewerkers||[]).includes(w.medewerkerId));
    if(zonder.length){ if(!wbAgg.has(d))wbAgg.set(d,{datum:d,klusId:null,wie:'',tijd:'',groep:'wb',n:0,ks:0,acties:[['Werkbonnen maken',`data-act="ovwbdag" data-d="${d}"`]]}); const g=wbAgg.get(d); g.n+=zonder.length; g.ks++ }
    if(oud.length)out.push({...base,groep:'wb',tekst:`${oud.length} werkbon${oud.length>1?'nen':''} verouderd`,sub:'tijden gewijzigd na het maken',acties:[['Bijwerken',`data-act="ovwb" data-id="${k.id}"`,'primary']]});
    weg.forEach(w=>out.push({...base,groep:'wb',tekst:`Werkbon ${w.nummer} hoort niet meer bij de klus`,sub:(w.snap&&w.snap.medewerker&&w.snap.medewerker.naam||'')+' staat er niet meer op',acties:[['Laten vervallen',`data-act="ovverval" data-id="${w.id}"`,'primary']]}));
  }));
  certAgg.forEach(c=>out.push({...c,tijd:'',sub:`staat op ${c.n} klus${c.n>1?'sen':''}`,wie:'verlopen sinds '+korteDatum(c.dt)}));
  wbAgg.forEach(g=>out.push({...g,tekst:`${g.n} werkbon${g.n>1?'nen':''} nog maken`,wie:`${g.ks} klus${g.ks>1?'sen':''} op ${datumKort(g.datum)}`}));
  // info per werkopdracht
  wos.forEach(id=>{const w=get('werken',id); if(!w)return; const kl=get('klanten',w.klantId), base={datum:w.van,wie:(w.nummer?w.nummer+' · ':'')+klantNaam(w.klantId)+(kopVan(w)?' · '+kopVan(w):''),tijd:''};
    if(!w.besteller||!w.besteller.naam)out.push({...base,groep:'info',tekst:'Geen besteller ingevuld',sub:'',acties:[['Werkopdracht',`data-werkedit="${w.id}"`]]});
    if(kl&&(!(kl.straat||kl.adres)||!kl.postcode||!kl.plaats))out.push({...base,groep:'info',tekst:'Adres van de klant onvolledig',sub:kl.bedrijf,acties:[['Klantkaart',`data-klant="${kl.id}"`]]});
  });
  return out.filter(t=>!(t.klusId&&['fout','open','check'].includes(t.groep)&&klusStatus(get('klussen',t.klusId))==='voorbij')).sort((a,b)=>a.datum.localeCompare(b.datum));
}
function ovPeriode(){

  if(p==='volgende')return[addDays(maandag(nu),7),addDays(maandag(nu),13)];

function parseTabel(txt){
  txt=String(txt||'').replace(/^﻿/,'').replace(/\r\n?/g,'\n'); if(!txt.trim())return[];
  const eerste=txt.split('\n')[0], tel=ch=>eerste.split(ch).length-1;
  const sep=[['\t',tel('\t')],[';',tel(';')],[',',tel(',')]].sort((a,b)=>b[1]-a[1])[0][0];
  const out=[]; let row=[], cel='', q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){cel+='"';i++} else q=false } else cel+=ch }
    else if(ch==='"'&&cel==='')q=true;
    else if(ch===sep){row.push(cel);cel=''}
    else if(ch==='\n'){row.push(cel);out.push(row);row=[];cel=''}
    else cel+=ch }
  if(cel!==''||row.length){row.push(cel);out.push(row)}
  return out.filter(r=>r.some(x=>String(x).trim()!==''));
}
function raadVeld(c,kop){ const n=normKop(kop); if(!n)return ''; const vs=impVelden(c);

function zetWaarde(v,ruw){
  const s0=String(ruw??'').trim(); if(s0==='')return undefined;
  if(v.t==='num'){const x=parseFloat(s0.replace(/[€\s]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.')); return isNaN(x)?undefined:x}
  if(v.t==='vest')return vestMatch(s0)||undefined;
  if(v.t==='klant'){const q=s0.toLowerCase(); const k=list('klanten').find(k=>String(k.bedrijf||'').toLowerCase()===q||String(k.debiteurnr||'').toLowerCase()===q); return k?k.id:undefined}
  if(v.t==='bool')return !/^(nee|n|no|0|false|onwaar|uit|inactief|niet actief|uit dienst)$/i.test(s0);
  if(v.t==='lijst')return s0.split(/[,;|\/]+/).map(x=>x.trim()).filter(Boolean);
  if(v.t==='datum'){ if(/^\d{5}$/.test(s0)){const d=new Date(Date.UTC(1899,11,30)+(+s0)*864e5); return d.toISOString().slice(0,10)}

async function exportCsv(c,leeg){
  const vs=impVelden(c), q=x=>{const s0=String(x??''); return /[;"\n]/.test(s0)?'"'+s0.replace(/"/g,'""')+'"':s0};
  const waarde=(r,v)=>{ if(v.f==='contactNaam'){const b=standaardBesteller(r);return b?b.naam:''} if(v.f==='contactTelefoon'){const b=standaardBesteller(r);return b?b.telefoon:''} if(v.f==='contactEmail'){const b=standaardBesteller(r);return b?b.email:''}
    const x=r[v.f]; if(v.t==='lijst')return (x||[]).join(', '); if(v.t==='bool')return x===false?'nee':'ja'; if(v.t==='num')return x==null||x===''?'':String(x).replace('.',','); if(c==='klanten'&&v.f==='straat'&&!r.straat)return r.adres||''; return x??'' };
  const rows=leeg?[]:list(c);
  const csv='﻿'+[vs.map(v=>q(v.l)).join(';'),...rows.map(r=>vs.map(v=>q(waarde(r,v))).join(';'))].join('\r\n');
  const naam=`vsvk-${c}${leeg?'-sjabloon':'-'+vandaag()}.csv`;
  if(!downloads){toast('Downloaden is in deze weergave niet mogelijk.');return}
  try{await downloads.save({filename:naam,data:csv});toast('Opgeslagen: '+naam)}catch(e){ if(e&&e.code!=='declined')toast('Downloaden lukt hier niet.') }
}

/* Alles wat binnen één handeling (klik, sleep, toets) wordt opgeslagen, vormt samen één stap. Tot 30 stappen terug. */
const ondo={groep:null,stapel:[],bezig:false};
const kloon=o=>o==null?null:JSON.parse(JSON.stringify(o));
function ondoNoteer(c,id){ if(ondo.bezig||id==null||c==='meta')return; if(!ondo.groep)ondo.groep=new Map(); const key=c+'/'+id; if(!ondo.groep.has(key))ondo.groep.set(key,{c,id,voor:kloon(S[c].get(id))}); clearTimeout(ondo.t); ondo.t=setTimeout(naHandeling,0) }
function ondoSluit(label){ const g=ondo.groep; ondo.groep=null; if(!g)return null;
  const items=[...g.values()].map(x=>({...x,na:kloon(S[x.c].get(x.id))})).filter(x=>JSON.stringify(x.voor)!==JSON.stringify(x.na)); if(!items.length)return null;
  const stap={items,label:label||'laatste wijziging'}; ondo.stapel.push(stap); if(ondo.stapel.length>30)ondo.stapel.shift(); return stap }
function ondoe(){ if(ondo.groep)ondoSluit();
  const stap=ondo.stapel.pop(); if(!stap){toast('Er is niets om ongedaan te maken');return}
  let botsing=0; ondo.bezig=true;
  try{ stap.items.slice().reverse().forEach(x=>{ const nu=kloon(S[x.c].get(x.id)); if(JSON.stringify(nu)!==JSON.stringify(x.na)){botsing++;return}
    if(x.voor)save(x.c,x.voor);
    else if(x.c==='werkbonnen'&&x.na)save(x.c,{...x.na,status:'Vervallen',vervallenOp:new Date().toISOString(),vervalReden:'Ongedaan gemaakt'});
    else if(x.c==='selfbills'&&x.na&&x.na.nummer)save(x.c,{...x.na,status:'Vervallen',historie:(x.na.historie||[]).concat([{op:new Date().toISOString(),wat:'Ongedaan gemaakt'}])});
    else if(x.c==='proformas'&&x.na&&x.na.nummer)save(x.c,{...x.na,status:'Vervallen',historie:(x.na.historie||[]).concat([{op:new Date().toISOString(),wat:'Ongedaan gemaakt'}])});
    else if(x.c==='werken'&&x.na&&x.na.nummer)save(x.c,{...x.na,geannuleerd:true,geannuleerdOp:new Date().toISOString(),annuleerReden:'Ongedaan gemaakt',voorraad:false});
    else del(x.c,x.id) }) }
  finally{ ondo.bezig=false }
  sluitSnel&&sluitSnel();
  toast('Ongedaan gemaakt: '+stap.label+(botsing?` · ${botsing} ${botsing===1?'onderdeel is':'onderdelen zijn'} intussen door iemand anders gewijzigd en ${botsing===1?'blijft':'blijven'} staan`:''),botsing?6000:3500) }
function naHandeling(){ if(ondo.bezig)return; const el=document.getElementById('toast'), vorig=el.classList.contains('show')&&!el.classList.contains('act')?el.textContent:'';
  const stap=ondoSluit(vorig); if(stap&&vorig&&!draft)toast(vorig,6000,[['Ongedaan maken',ondoe]]) }
document.addEventListener('keydown',e=>{ if(!(e.ctrlKey||e.metaKey)||e.shiftKey||e.altKey||String(e.key).toLowerCase()!=='z')return;
  const t=e.target; if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))return;
  e.preventDefault(); if(layer.querySelector('.drawer,.modal')){toast('Sluit eerst het venster, dan kun je ongedaan maken');return} if(drag)return; ondoe() });

const zoek={el:null,res:[],i:0};
function zoekResultaten(q){ q=q.trim().toLowerCase(); if(!q)return [];
  const sc=(...v)=>{let best=0; v.filter(Boolean).forEach(x=>{x=String(x).toLowerCase(); if(x===q)best=Math.max(best,4); else if(x.startsWith(q))best=Math.max(best,3); else if(x.split(/[\s·,-]+/).some(w=>w.startsWith(q)))best=Math.max(best,2); else if(x.includes(q))best=Math.max(best,1)}); return best};
  const out=[];
  const dm=/^(\d{1,2})[-\/ .](\d{1,2})(?:[-\/ .](\d{2,4}))?$/.exec(q); let dd=q==='vandaag'?vandaag():q==='morgen'?addDays(vandaag(),1):null;
  if(dm){const j=dm[3]?(dm[3].length===2?2000+ +dm[3]:+dm[3]):parseD(vandaag()).getFullYear(); const x=new Date(j,+dm[2]-1,+dm[1]); if(x.getMonth()===+dm[2]-1)dd=iso(x)}
  if(dd)out.push({s:9,soort:'Datum',txt:langeDatum(dd),sub:'planbord · week '+weeknr(dd),doe:()=>{ui.tab='planning';ui.datum=dd;render.scrolled=false;render()}});
  list('medewerkers').filter(m=>m.actief!==false).forEach(m=>{const s=sc(m.naam,m.functie,m.personeelsnr,...(m.skills||[])); if(s)out.push({s,soort:'Medewerker',txt:m.naam,sub:[m.functie,vestKort(m.vestiging)].filter(x=>x&&x!=='—').join(' · '),doe:()=>openKaart('mw',m.id)})});
  list('materieel').filter(t=>t.actief!==false).forEach(t=>{const s=sc(t.code,t.naam,t.type,t.serienr); if(s)out.push({s,soort:'Materieel',txt:t.code+' · '+t.naam,sub:t.type||'',doe:()=>openKaart('mat',t.id)})});
  klantenActief().forEach(k=>{const s=sc(k.bedrijf,k.debiteurnr,k.plaats,...klantContacten(k).map(c=>c.naam)); if(s)out.push({s,soort:'Klant',txt:k.bedrijf||'Klant',sub:k.plaats||'',doe:()=>openKlant(k.id)})});
  list('werken').forEach(w=>{const s=sc(w.nummer,w.oudNummer,kopVan(w),w.internNr,klantNaam(w.klantId),w.locatie); if(s)out.push({s:s-.5+(w.voorraad||(w.tot||w.van)>=vandaag()?.4:0),soort:'Werkopdracht',txt:(w.nummer||'')+' · '+klantNaam(w.klantId),sub:[kopVan(w),w.geannuleerd?'geannuleerd':w.voorraad?'werkvoorraad':w.van?korteDatum(w.van)+(w.tot&&w.tot!==w.van?' t/m '+korteDatum(w.tot):''):''].filter(Boolean).join(' · '),doe:()=>openWerk(w.id)})});
  if(q.length>=3)list('werkbonnen').forEach(w=>{const s=sc(w.nummer,w.nummer&&w.nummer.replace(/-/g,''),w.oudNummer); if(s)out.push({s:s-.6,soort:'Werkbon',txt:w.nummer,sub:[(w.snap&&w.snap.medewerker&&w.snap.medewerker.naam)||'',korteDatum(w.datum),w.status].filter(Boolean).join(' · '),doe:()=>{const b=document.createElement('button'); b.dataset.wbview=w.id; wbActies(b)}})});
  return out.sort((a,b)=>b.s-a.s||a.txt.localeCompare(b.txt,'nl')).slice(0,12) }
function zoekTeken(){ const z=zoek.el; if(!z)return; const q=z.querySelector('input').value; zoek.res=zoekResultaten(q); zoek.i=Math.min(zoek.i,Math.max(0,zoek.res.length-1));
  z.querySelector('.zres').innerHTML=zoek.res.length?zoek.res.map((r,i)=>`<button type="button" class="zr ${i===zoek.i?'on':''}" data-zi="${i}"><span>${esc(r.soort)}</span><b>${esc(r.txt)}${r.sub?`<small>${esc(r.sub)}</small>`:''}</b></button>`).join(''):`<div class="zleeg">${q.trim()?'Niets gevonden.':'Typ een naam, code, WO- of werkbonnummer, of een datum zoals 12-11.'}</div>`;
  const on=z.querySelector('.zr.on'); if(on)on.scrollIntoView({block:'nearest'}) }
function zoekSluit(){ if(zoek.el){zoek.el.remove();zoek.el=null} }
function zoekKies(i){ const r=zoek.res[i]; zoekSluit(); if(r)r.doe() }
function zoekOpen(){ if(layer.querySelector('.drawer')){toast('Sla eerst het klusvenster op of sluit het');return} if(zoek.el){zoek.el.querySelector('input').focus();return} closeModal(); sluitSnel&&sluitSnel();
  const z=document.createElement('div'); z.id='zoeker'; z.innerHTML=`<div class="zbox" role="dialog" aria-label="Snelzoeker"><input type="search" placeholder="Zoek medewerker, materieel, klant, WO, werkbon of datum…" aria-label="Zoeken" autocomplete="off"><div class="zres"></div><div class="zhint"><span><kbd>↑</kbd> <kbd>↓</kbd> kiezen</span><span><kbd>Enter</kbd> openen</span><span><kbd>Esc</kbd> sluiten</span></div></div>`;
  document.body.appendChild(z); zoek.el=z; zoek.i=0; const inp=z.querySelector('input');
  inp.addEventListener('input',()=>{zoek.i=0;zoekTeken()});
  inp.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault(); if(zoek.res.length){zoek.i=(zoek.i+(e.key==='ArrowDown'?1:-1)+zoek.res.length)%zoek.res.length; zoekTeken()}} else if(e.key==='Enter'){e.preventDefault(); zoekKies(zoek.i)} else if(e.key==='Escape'){e.preventDefault(); e.stopPropagation(); zoekSluit()} });
  z.addEventListener('click',e=>{ const b=e.target.closest('[data-zi]'); if(b){zoekKies(+b.dataset.zi);return} if(e.target===z)zoekSluit() });
  zoekTeken(); inp.focus() }
function sneltoetsUitleg(){ toast('Sneltoetsen: Ctrl+K zoeken · ← → vorige/volgende dag · T vandaag · / zoeken in de lijst links · Ctrl+Z ongedaan maken',8000) }

  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&String(e.key).toLowerCase()==='k'){e.preventDefault(); zoekOpen(); return}
