services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:-vsvk_calc}
      POSTGRES_USER: ${PGUSER:-vsvk}
      POSTGRES_PASSWORD: ${PGPASSWORD:-vsvk}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-vsvk} -d ${PGDATABASE:-vsvk_calc}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AppDb: Host=postgres;Port=5432;Database=${PGDATABASE:-vsvk_calc};Username=${PGUSER:-vsvk};Password=${PGPASSWORD:-vsvk}
      Jwt__Authority: http://localhost:8081/realms/vsvk
      Jwt__MetadataAddress: http://keycloak:8080/realms/vsvk/.well-known/openid-configuration
      Jwt__Audience: vsvk-api
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AppDb: Host=postgres;Port=5432;Database=${PGDATABASE:-vsvk_calc};Username=${PGUSER:-vsvk};Password=${PGPASSWORD:-vsvk}
      Jwt__Authority: http://localhost:8081/realms/vsvk
      Jwt__MetadataAddress: http://keycloak:8080/realms/vsvk/.well-known/openid-configuration
      Jwt__Audience: vsvk-api
    depends_on:
      postgres:
        condition: service_healthy

  bff:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Oidc__Authority: http://localhost:8081/realms/vsvk
      Oidc__MetadataAddress: http://keycloak:8080/realms/vsvk/.well-known/openid-configuration
      Oidc__ClientId: vsvk-bff
      Oidc__ClientSecret: dev-secret
      Oidc__CallbackPath: /signin-oidc

  keycloak:
    command: ["start", "--http-port=8080", "--import-realm"]
    volumes:
      - ../keycloak/import:/opt/keycloak/data/import:ro
    environment:
      KC_HOSTNAME: http://localhost:8081

volumes:
  pgdata:
